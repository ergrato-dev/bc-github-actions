# ci-web.yml — capa 04 de tablero.
# Cópialo a .github/workflows/ci-web.yml de <tu-org>/tablero y completa los TODO.
# Eventos, permisos, defaults y el job lint ya vienen; ci.yml y ci-api.yml no se tocan.
# Tal como está pasa actionlint, pero no cumple la capa: check-week.sh 04 sale en rojo.
name: ci-web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Mínimo privilegio: lo verás a fondo en la Semana 12.
permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: web

jobs:
  lint:
    name: Lint (eslint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          # TODO 1: cachea el store de pnpm, con la clave atada a web/pnpm-lock.yaml.
      - name: Dependencias exactas del lockfile
        run: pnpm install --frozen-lockfile
      - name: eslint
        run: pnpm lint

  test:
    name: Tests
    runs-on: ubuntu-24.04
    # TODO 2: matriz con Node 24 y 26 en la que un fallo en una versión no cancele la otra;
    # el name del job dice qué versión es y setup-node la recibe de la matriz.
    steps:
      - run: echo "test pendiente" && exit 1

  # TODO 3: job build que solo empiece si lint y test terminan bien, prepare pnpm y Node 26
  # igual que lint e instale con el lockfile, y ejecute pnpm build.
  # TODO 4: que build suba web/dist como artefacto web-dist, falle si no hay archivos y
  # caduque en 7 días.

  # TODO 5: job dist-report que espere a build, descargue web-dist sin volver a construir y
  # escriba en $GITHUB_STEP_SUMMARY el tamaño de cada archivo.
