<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t01">
  <title id="t01">Cómo se expande una matriz en tres pasos. Paso 1, producto cartesiano: node 24 y 26 por reporter default y verbose dan cuatro combinaciones. Paso 2, exclude: la entrada node 24 con reporter verbose coincide con una combinación y la quita, quedan tres. Paso 3, include, que se procesa después de exclude: la entrada node 26 con coverage true no pisa ningún valor original, así que se añade a las dos combinaciones con node 26. Resultado: tres jobs, dos de ellos con coverage. fail-fast false hace que un fallo no cancele a los demás y max-parallel limita cuántos corren a la vez. Máximo 256 jobs por matriz</title>
  <rect width="960" height="560" fill="#0d1117"/>
  <defs>
    <marker id="a01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#79c0ff"/></marker>
  </defs>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="480" y="36" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">Cómo se expande una matriz</text>

    <!-- YAML -->
    <rect x="20" y="60" width="260" height="258" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="40" y="84" fill="#8b949e" font-size="12">strategy:</text>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">
      <text x="40" y="106" fill="#d2a8ff">fail-fast: false</text>
      <text x="40" y="124" fill="#d2a8ff">max-parallel: 3</text>
      <text x="40" y="146" fill="#f0f6fc">matrix:</text>
      <text x="56" y="164" fill="#2088ff">node: [24, 26]</text>
      <text x="56" y="182" fill="#2088ff">reporter: [default, verbose]</text>
      <text x="56" y="204" fill="#f85149">exclude:</text>
      <text x="72" y="222" fill="#f85149">- node: 24</text>
      <text x="72" y="240" fill="#f85149">  reporter: verbose</text>
      <text x="56" y="262" fill="#3fb950">include:</text>
      <text x="72" y="280" fill="#3fb950">- node: 26</text>
      <text x="72" y="298" fill="#3fb950">  coverage: true</text>
    </g>

    <!-- paso 1 -->
    <text x="420" y="86" fill="#f0f6fc" font-size="14" font-weight="600" text-anchor="middle">1. Producto cartesiano</text>
    <text x="420" y="104" fill="#8b949e" font-size="12" text-anchor="middle">2 × 2 = 4 combinaciones</text>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#f0f6fc" text-anchor="middle">
      <rect x="330" y="120" width="180" height="32" rx="5" fill="#0d1117" stroke="#2088ff"/><text x="420" y="141">24 · default</text>
      <rect x="330" y="162" width="180" height="32" rx="5" fill="#0d1117" stroke="#2088ff"/><text x="420" y="183">24 · verbose</text>
      <rect x="330" y="204" width="180" height="32" rx="5" fill="#0d1117" stroke="#2088ff"/><text x="420" y="225">26 · default</text>
      <rect x="330" y="246" width="180" height="32" rx="5" fill="#0d1117" stroke="#2088ff"/><text x="420" y="267">26 · verbose</text>
    </g>
    <path d="M280 185 L326 185" stroke="#79c0ff" stroke-width="2" marker-end="url(#a01)"/>

    <!-- paso 2 -->
    <text x="640" y="86" fill="#f0f6fc" font-size="14" font-weight="600" text-anchor="middle">2. exclude</text>
    <text x="640" y="104" fill="#8b949e" font-size="12" text-anchor="middle">basta con coincidir en parte</text>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <rect x="550" y="120" width="180" height="32" rx="5" fill="#0d1117" stroke="#2088ff"/><text x="640" y="141" fill="#f0f6fc">24 · default</text>
      <rect x="550" y="162" width="180" height="32" rx="5" fill="#0d1117" stroke="#f85149" stroke-dasharray="5 4"/><text x="640" y="183" fill="#f85149" text-decoration="line-through">24 · verbose</text>
      <rect x="550" y="204" width="180" height="32" rx="5" fill="#0d1117" stroke="#2088ff"/><text x="640" y="225" fill="#f0f6fc">26 · default</text>
      <rect x="550" y="246" width="180" height="32" rx="5" fill="#0d1117" stroke="#2088ff"/><text x="640" y="267" fill="#f0f6fc">26 · verbose</text>
    </g>
    <path d="M510 199 L546 199" stroke="#79c0ff" stroke-width="2" marker-end="url(#a01)"/>

    <!-- paso 3 -->
    <text x="845" y="86" fill="#f0f6fc" font-size="14" font-weight="600" text-anchor="middle">3. include</text>
    <text x="845" y="104" fill="#8b949e" font-size="12" text-anchor="middle">después de exclude</text>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <rect x="770" y="120" width="150" height="32" rx="5" fill="#0d1117" stroke="#2088ff"/><text x="845" y="141" fill="#f0f6fc">24 · default</text>
      <rect x="770" y="204" width="150" height="50" rx="5" fill="#0d1117" stroke="#3fb950"/><text x="845" y="224" fill="#f0f6fc">26 · default</text><text x="845" y="243" fill="#3fb950">+ coverage</text>
      <rect x="770" y="262" width="150" height="50" rx="5" fill="#0d1117" stroke="#3fb950"/><text x="845" y="282" fill="#f0f6fc">26 · verbose</text><text x="845" y="301" fill="#3fb950">+ coverage</text>
    </g>
    <path d="M730 220 L766 220" stroke="#79c0ff" stroke-width="2" marker-end="url(#a01)"/>

    <!-- reglas de include -->
    <rect x="20" y="336" width="920" height="100" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="40" y="362" fill="#f0f6fc" font-size="14" font-weight="600">Regla de include, entrada a entrada</text>
    <text x="40" y="386" fill="#3fb950" font-size="13">Si puede añadirse sin pisar un valor original, se añade a todas las combinaciones con las que encaja.</text>
    <text x="40" y="408" fill="#e3b341" font-size="13">Si pisaría un valor original en todas (por ejemplo node: 22), crea una combinación nueva.</text>
    <text x="40" y="428" fill="#8b949e" font-size="12">Los valores originales nunca se sobrescriben; los que añadió otra entrada de include, sí.</text>

    <!-- ejecución -->
    <rect x="20" y="452" width="450" height="80" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="40" y="478" fill="#d2a8ff" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">fail-fast: false</text>
    <text x="40" y="500" fill="#f0f6fc" font-size="12">Un job que falla no cancela a los demás.</text>
    <text x="40" y="518" fill="#8b949e" font-size="12">Por defecto vale true: cancela los que corren y los que esperan.</text>
    <rect x="490" y="452" width="450" height="80" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="510" y="478" fill="#d2a8ff" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">max-parallel: 3</text>
    <text x="510" y="500" fill="#f0f6fc" font-size="12">Como mucho tres jobs de la matriz a la vez.</text>
    <text x="510" y="518" fill="#8b949e" font-size="12">Límite duro: 256 jobs por matriz en un run.</text>
  </g>
</svg>
