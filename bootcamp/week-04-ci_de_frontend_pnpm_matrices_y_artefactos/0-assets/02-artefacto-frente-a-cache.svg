<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t02">
  <title id="t02">Artefacto frente a caché. A la izquierda, un artefacto: el job build sube web/dist con upload-artifact, queda guardado en el run con nombre único, inmutable y con digest SHA-256, el job siguiente del mismo run lo descarga con download-artifact y tú lo bajas con gh run download hasta que caduca por retention-days. Garantía: exactamente lo que se subió. A la derecha, una caché: el run 1 guarda el store de pnpm con una clave derivada de pnpm-lock.yaml, el run 2 la restaura solo si la clave coincide y su rama puede leerla, y la entrada puede desaparecer por 7 días sin uso o por superar 10 GB. Garantía: ninguna, el job tiene que funcionar sin ella</title>
  <rect width="960" height="560" fill="#0d1117"/>
  <defs>
    <marker id="a02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#79c0ff"/></marker>
  </defs>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="480" y="36" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">Artefacto frente a caché</text>

    <!-- artefacto -->
    <rect x="20" y="56" width="450" height="420" rx="8" fill="#161b22" stroke="#2088ff" stroke-width="2"/>
    <text x="40" y="84" fill="#2088ff" font-size="16" font-weight="600">Artefacto: el resultado de un run</text>
    <text x="40" y="104" fill="#8b949e" font-size="12">upload-artifact · download-artifact · gh run download</text>

    <rect x="40" y="124" width="410" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="56" y="149" fill="#f0f6fc" font-size="13">Run 41 · job build</text>
    <text x="434" y="149" fill="#f0f6fc" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="end">sube web/dist</text>
    <path d="M245 164 L245 190" stroke="#79c0ff" stroke-width="2" marker-end="url(#a02)"/>
    <rect x="40" y="194" width="410" height="66" rx="6" fill="#0d1117" stroke="#3fb950"/>
    <text x="56" y="218" fill="#3fb950" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">web-dist</text>
    <text x="56" y="238" fill="#f0f6fc" font-size="12">nombre único en el run · inmutable</text>
    <text x="56" y="254" fill="#d2a8ff" font-size="12">artifact-id · artifact-digest (SHA-256)</text>
    <path d="M150 260 L150 290" stroke="#79c0ff" stroke-width="2" marker-end="url(#a02)"/>
    <path d="M340 260 L340 290" stroke="#79c0ff" stroke-width="2" marker-end="url(#a02)"/>
    <rect x="40" y="294" width="200" height="54" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="140" y="316" fill="#f0f6fc" font-size="12" text-anchor="middle">Run 41 · job siguiente</text>
    <text x="140" y="336" fill="#8b949e" font-size="11" text-anchor="middle">download-artifact</text>
    <rect x="250" y="294" width="200" height="54" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="350" y="316" fill="#f0f6fc" font-size="12" text-anchor="middle">Tu máquina</text>
    <text x="350" y="336" fill="#8b949e" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">gh run download 41</text>

    <text x="40" y="378" fill="#e3b341" font-size="12">Caduca cuando dice retention-days: 90 días por defecto,</text>
    <text x="40" y="396" fill="#e3b341" font-size="12">1-90 en un repo público. Antes, solo si lo borras.</text>
    <rect x="40" y="412" width="410" height="48" rx="6" fill="#0d1117" stroke="#3fb950"/>
    <text x="245" y="441" fill="#3fb950" font-size="13" font-weight="600" text-anchor="middle">Garantiza: exactamente lo que se subió</text>

    <!-- caché -->
    <rect x="490" y="56" width="450" height="420" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="510" y="84" fill="#f0f6fc" font-size="16" font-weight="600">Caché: un atajo entre runs</text>
    <text x="510" y="104" fill="#8b949e" font-size="12">setup-node con cache: pnpm · actions/cache</text>

    <rect x="510" y="124" width="410" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="526" y="149" fill="#f0f6fc" font-size="13">Run 41 · main</text>
    <text x="904" y="149" fill="#f0f6fc" font-size="12" text-anchor="end">guarda el store al terminar bien</text>
    <path d="M715 164 L715 190" stroke="#79c0ff" stroke-width="2" marker-end="url(#a02)"/>
    <rect x="510" y="194" width="410" height="66" rx="6" fill="#0d1117" stroke="#d2a8ff"/>
    <text x="526" y="218" fill="#d2a8ff" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">node-cache-Linux-x64-pnpm-&lt;hash&gt;</text>
    <text x="526" y="238" fill="#f0f6fc" font-size="12">clave derivada de pnpm-lock.yaml</text>
    <text x="526" y="254" fill="#8b949e" font-size="12">la leen su rama y, si se creó en main, todas</text>
    <path d="M715 260 L715 290" stroke="#79c0ff" stroke-width="2" marker-end="url(#a02)"/>
    <rect x="510" y="294" width="410" height="54" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="715" y="316" fill="#f0f6fc" font-size="12" text-anchor="middle">Run 42 · restaura si la clave coincide</text>
    <text x="715" y="336" fill="#8b949e" font-size="11" text-anchor="middle">si no, pnpm descarga del registro y sigue igual</text>

    <text x="510" y="378" fill="#f85149" font-size="12">Puede desaparecer: 7 días sin uso, o expulsada</text>
    <text x="510" y="396" fill="#f85149" font-size="12">cuando el repo supera 10 GB de caché.</text>
    <rect x="510" y="412" width="410" height="48" rx="6" fill="#0d1117" stroke="#e3b341"/>
    <text x="715" y="441" fill="#e3b341" font-size="13" font-weight="600" text-anchor="middle">Garantiza: nada. El job funciona sin ella</text>

    <text x="480" y="508" fill="#f0f6fc" font-size="14" text-anchor="middle">¿Otro job o una persona necesita este archivo concreto? Artefacto.</text>
    <text x="480" y="532" fill="#8b949e" font-size="13" text-anchor="middle">¿Solo quieres no volver a descargar lo que ya dice el lockfile? Caché.</text>
  </g>
</svg>
