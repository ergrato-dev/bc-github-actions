<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="t3">
  <title id="t3">Una plantilla se copia una vez; un reutilizable se llama en cada run. El repo .github de la organización guarda workflow-templates/ci-python.yml y su .properties.json. Al crear el workflow en un repo nuevo, GitHub copia la plantilla y sustituye $default-branch por la rama por defecto: a partir de ahí es un archivo del repo y los cambios posteriores de la plantilla no le llegan. La copia solo contiene disparadores, permisos y un job que llama a _python.yml de actions-tablero fijado por SHA, que se ejecuta en cada run; lo que cambia con el tiempo vive en el repo central y llega subiendo el SHA.</title>
  <rect width="960" height="500" fill="#0d1117"/>
  <defs>
    <marker id="a3y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e3b341"/></marker>
    <marker id="a3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2088ff"/></marker>
  </defs>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="480" y="36" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">Plantilla: una copia al crear · Reutilizable: una llamada en cada run</text>

    <!-- .github -->
    <rect x="30" y="70" width="280" height="160" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
    <text x="46" y="96" fill="#d2a8ff" font-size="15" font-weight="600">&lt;tu-org&gt;/.github</text>
    <text x="46" y="116" fill="#8b949e" font-size="12">público · workflow-templates/ en la raíz</text>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">
      <text x="46" y="148" fill="#f0f6fc">ci-python.yml</text>
      <text x="46" y="168" fill="#f0f6fc">ci-python.properties.json</text>
      <text x="62" y="188" fill="#8b949e">name · description</text>
      <text x="62" y="206" fill="#8b949e">categories · iconName · filePatterns</text>
    </g>

    <!-- repo nuevo -->
    <rect x="370" y="70" width="280" height="200" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="386" y="96" fill="#f0f6fc" font-size="15" font-weight="600">&lt;tu-org&gt;/repo-nuevo</text>
    <text x="386" y="116" fill="#8b949e" font-size="12">.github/workflows/ci-python.yml</text>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">
      <text x="386" y="146" fill="#f0f6fc">branches: [<tspan fill="#e3b341">main</tspan>]</text>
      <text x="386" y="166" fill="#f0f6fc">permissions: contents: read</text>
      <text x="386" y="186" fill="#f0f6fc">concurrency: …</text>
      <text x="386" y="210" fill="#2088ff">uses: …/_python.yml@a7e19ff…</text>
      <text x="386" y="228" fill="#8b949e">     # v1.0.0</text>
    </g>
    <text x="386" y="256" fill="#8b949e" font-size="12">Un archivo más del repo</text>

    <path d="M310 150 L366 150" stroke="#e3b341" stroke-width="2" fill="none" marker-end="url(#a3y)"/>
    <text x="338" y="140" fill="#e3b341" font-size="11" text-anchor="middle">copia</text>
    <text x="338" y="172" fill="#e3b341" font-size="10" text-anchor="middle">una vez</text>

    <!-- central -->
    <rect x="710" y="70" width="220" height="200" rx="8" fill="#161b22" stroke="#2088ff" stroke-width="2"/>
    <text x="726" y="96" fill="#2088ff" font-size="15" font-weight="600">actions-tablero</text>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">
      <text x="726" y="126" fill="#f0f6fc">_python.yml</text>
      <text x="726" y="148" fill="#8b949e">ruff · pytest</text>
      <text x="726" y="166" fill="#8b949e">cobertura</text>
      <text x="726" y="184" fill="#8b949e">$/setup-tablero</text>
    </g>
    <text x="726" y="216" fill="#f0f6fc" font-size="12">Lo que cambia con el</text>
    <text x="726" y="234" fill="#f0f6fc" font-size="12">tiempo vive aquí</text>
    <path d="M650 206 L706 206" stroke="#2088ff" stroke-width="2" fill="none" marker-end="url(#a3b)"/>
    <text x="678" y="196" fill="#2088ff" font-size="11" text-anchor="middle">cada run</text>

    <!-- tabla -->
    <rect x="30" y="300" width="900" height="176" rx="8" fill="#161b22" stroke="#30363d"/>
    <g font-size="13">
      <text x="210" y="328" fill="#8b949e" font-weight="600">Si cambias…</text>
      <text x="430" y="328" fill="#8b949e" font-weight="600">…el repo nuevo ya creado</text>
      <text x="690" y="328" fill="#8b949e" font-weight="600">…uno creado después</text>
      <line x1="46" y1="340" x2="914" y2="340" stroke="#30363d"/>
      <text x="46" y="368" fill="#d2a8ff">la plantilla</text>
      <text x="430" y="368" fill="#f85149">No se entera</text>
      <text x="690" y="368" fill="#3fb950">Arranca con el cambio</text>
      <text x="46" y="400" fill="#2088ff">_python.yml (v1.1.0)</text>
      <text x="430" y="400" fill="#e3b341">Lo recibe al subir el SHA</text>
      <text x="690" y="400" fill="#e3b341">Si la plantilla fija v1.1.0</text>
      <text x="46" y="432" fill="#f0f6fc">un input de la plantilla</text>
      <text x="430" y="432" fill="#f85149">No se entera</text>
      <text x="690" y="432" fill="#3fb950">Arranca con el cambio</text>
      <text x="46" y="462" fill="#8b949e" font-size="12">Por eso la plantilla no lleva lógica: solo cuándo corre y con qué inputs.</text>
    </g>
  </g>
</svg>
