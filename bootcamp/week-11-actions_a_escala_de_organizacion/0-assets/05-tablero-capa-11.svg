<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 880" role="img" aria-labelledby="t11">
  <title id="t11">Mapa del pipeline de tablero en la capa 11. Arriba, sin cambios: smoke.yml, nightly.yml y lint-workflows.yml. A la izquierda, tablero, que ya no guarda copias locales: desaparecen .github/actions, _python.yml, _node.yml, _image.yml y test-actions.yml. Sus llamadores apuntan al repo central fijado por el SHA de v1.0.0: ci-api.yml llama a _python.yml; ci-web.yml llama a _node.yml en el job web y usa setup-tablero y coverage-report en el job coverage; images.yml llama a _image.yml en los jobs api y web; ci.yml usa sql-lint en el job sql. Siete referencias, un solo SHA y un solo tag. A la derecha, el repo nuevo actions-tablero: setup-tablero, coverage-report y sql-lint en la raíz; _python.yml y _node.yml usan $/setup-tablero; _image.yml; ci.yml con los jobs actionlint, zizmor, coverage-report y sql-lint; .github/actionlint.yaml que ignora solo el error de $/; y la release inmutable v1.0.0 comprobada con gh release verify. Abajo, la organización: el repo .github público con la plantilla ci-python, que llama a _python.yml central por SHA y filtra por $default-branch, y las políticas de actions: allowed_actions selected, pinning por SHA obligatorio, actions de GitHub y lista de patrones, token por defecto de solo lectura sin aprobar pull requests. En gris, lo que llega después: permisos a fondo y Dependabot en la Semana 12, secretos y OIDC en la 13, attestations y SBOM en la 14.</title>
  <rect width="960" height="880" fill="#0d1117"/>
  <defs>
    <marker id="a11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2088ff"/></marker>
  </defs>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="480" y="36" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">tablero · capa 11</text>

    <!-- sin cambios -->
    <rect x="30" y="58" width="900" height="44" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="46" y="85" fill="#8b949e" font-size="12" font-weight="600">sin cambios</text>
    <g font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#f0f6fc">
      <text x="146" y="85">smoke.yml</text><text x="286" y="85">nightly.yml</text><text x="436" y="85">lint-workflows.yml</text>
    </g>

    <!-- columnas -->
    <text x="30" y="134" fill="#f0f6fc" font-size="14" font-weight="600">&lt;tu-org&gt;/tablero · solo llamadores</text>
    <text x="930" y="134" fill="#2088ff" font-size="14" font-weight="600" text-anchor="end">&lt;tu-org&gt;/actions-tablero · nuevo</text>

    <!-- tablero -->
    <rect x="30" y="146" width="410" height="68" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="46" y="170" fill="#f0f6fc" font-size="14" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">ci-api.yml</text>
    <text x="46" y="196" fill="#79c0ff" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace">api → _python.yml@a7e19ff… # v1.0.0</text>

    <rect x="30" y="224" width="410" height="104" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="46" y="248" fill="#f0f6fc" font-size="14" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">ci-web.yml</text>
    <g font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="46" y="272" fill="#79c0ff">web → _node.yml@a7e19ff…</text>
      <text x="46" y="292" fill="#79c0ff">coverage: setup-tablero@a7e19ff…</text>
      <text x="46" y="312" fill="#79c0ff">          coverage-report@a7e19ff…</text>
