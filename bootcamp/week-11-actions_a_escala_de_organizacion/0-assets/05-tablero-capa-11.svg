    <rect x="536" y="448" width="378" height="96" rx="6" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <text x="552" y="472" fill="#3fb950" font-size="13" font-weight="600">Release v1.0.0 · inmutable</text>
    <g font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="552" y="494" fill="#f0f6fc">tag fijo en a7e19ff… (SHA de ejemplo)</text>
      <text x="552" y="512" fill="#f0f6fc">gh release verify v1.0.0</text>
      <text x="552" y="530" fill="#8b949e">ci.yml en verde sobre ese commit</text>
    </g>

