    <text x="725" y="584" fill="#2088ff" font-size="11" text-anchor="middle">desde tablero: 7 uses · 1 SHA · 1 tag</text>

    <!-- org -->
    <text x="30" y="616" fill="#d2a8ff" font-size="14" font-weight="600">Organización &lt;tu-org&gt;</text>
    <rect x="30" y="628" width="410" height="120" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
    <text x="46" y="652" fill="#d2a8ff" font-size="13" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">&lt;tu-org&gt;/.github · público</text>
    <g font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="46" y="676" fill="#f0f6fc">workflow-templates/ci-python.yml</text>
