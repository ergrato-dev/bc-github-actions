      <text x="552" y="368" fill="#8b949e" font-size="11">actionlint · zizmor .</text>
      <text x="552" y="386" fill="#8b949e" font-size="11">coverage-report: test + dist</text>
      <text x="552" y="404" fill="#8b949e" font-size="11">sql-lint: humo, files = 1</text>
