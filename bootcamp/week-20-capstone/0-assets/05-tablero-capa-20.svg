<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 980" role="img" aria-labelledby="t20">
  <title id="t20">Mapa del pipeline de tablero en la capa 20, la última. Arriba, la regla de todos los workflows desde la capa 12: permissions vacío en la raíz, permisos por job y ninguna expresión dentro de run. A la izquierda, lo que ya existía y sigue igual: nightly, labeler y codeql, dependency-review, lab.yml en tablero-runners, deploy.yml, pr-report, ci-metrics y cleanup, los reutilizables de área y el ruleset de main con ci-gate y merge queue. A la derecha, lo que cambia o llega en la capa 20. En ci.yml, changes gana el área worker, que se activa con worker/ o api/migrations/, el job worker llama a ci-worker.yml y ci-gate lo espera; structure comprueba worker/uv.lock. ci-worker.yml no tiene steps: solo llama a _python.yml del repo central con integración. images.yml y release.yml construyen, publican, escanean y firman tablero-worker con la matriz api, web y worker. lint-workflows.yml gana el job policy, que pasa scripts/audit-workflows.sh. Piezas nuevas del repo: worker/ con su Dockerfile por digest, scripts/audit-workflows.sh con seis reglas y docs/pipeline.md con cinco secciones. Configuración: actions-tablero v1.1.0 corrige tres hallazgos y todas las referencias de tablero apuntan a su commit; Dependabot vigila uv y docker en /worker; deploy.yml no cambia y el worker no se despliega, un riesgo aceptado. Abajo, el cierre: a partir de aquí el pipeline es tuyo.</title>
