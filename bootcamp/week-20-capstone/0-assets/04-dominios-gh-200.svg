<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t04">
  <title id="t04">Los cinco dominios del examen GH-200 según la guía vigente de enero de 2026, con su peso y las semanas del bootcamp que cubren cada uno. D1, Author and manage workflows, 20-25 %: semanas 01, 02, 03, 04, 05, 06, 07, 08, 09, 17, 18, 20. D2, Consume and troubleshoot workflows, 15-20 %: semanas 01, 04, 06, 08, 09, 12, 13, 14, 17, 19, 20. D3, Author and maintain actions, 15-20 %: semanas 10, 11, 12, 20. D4, Manage GitHub Actions for the enterprise, 20-25 %: semanas 01, 11, 12, 13, 14, 15, 16, 18, 19, 20. D5, Secure and optimize automation, 10-15 %: semanas 03, 04, 11, 12, 13, 14, 17, 18, 19, 20. La semana 20 repasa los cinco. Las fases del bootcamp aparecen como bandas sobre las columnas de semanas.</title>
