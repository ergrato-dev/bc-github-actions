<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t04">
  <title id="t04">Mapa del pipeline de tablero en la capa 01: el repo público de la organización con api, web y compose.yaml; ci.yml se dispara con push a main, pull_request y workflow_dispatch, con permissions contents read, y lanza en paralelo los jobs runner-info y structure en ubuntu-24.04, structure con actions/checkout fijado por SHA. En gris, las capas que llegan después: ci-api en la Semana 03, ci-web en la 04, integración con PostgreSQL en la 05 e imágenes en GHCR en la 06</title>
  <rect width="960" height="520" fill="#0d1117"/>
  <defs>
    <marker id="b-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#79c0ff"/></marker>
  </defs>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="480" y="36" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">tablero · capa 01</text>

    <!-- repo -->
    <rect x="30" y="70" width="230" height="230" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="50" y="98" fill="#f0f6fc" font-size="15" font-weight="600">&lt;tu-org&gt;/tablero</text>
    <text x="50" y="118" fill="#8b949e" font-size="12">repo público de una organización</text>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#f0f6fc">
      <text x="50" y="150">api/        uv.lock</text>
      <text x="50" y="174">web/        pnpm-lock.yaml</text>
      <text x="50" y="198">compose.yaml</text>
      <text x="50" y="230" fill="#2088ff">.github/workflows/</text>
      <text x="70" y="254" fill="#2088ff">ci.yml</text>
      <text x="70" y="278" fill="#8b949e">hello.yml (prácticas)</text>
    </g>

    <!-- eventos -->
    <g font-size="13">
      <rect x="320" y="80" width="170" height="34" rx="17" fill="#0d1117" stroke="#79c0ff"/>
      <text x="405" y="102" fill="#79c0ff" text-anchor="middle">push a main</text>
      <rect x="320" y="128" width="170" height="34" rx="17" fill="#0d1117" stroke="#79c0ff"/>
      <text x="405" y="150" fill="#79c0ff" text-anchor="middle">pull_request</text>
      <rect x="320" y="176" width="170" height="34" rx="17" fill="#0d1117" stroke="#79c0ff"/>
      <text x="405" y="198" fill="#79c0ff" text-anchor="middle">workflow_dispatch</text>
    </g>
    <path d="M490 97 L560 140" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#b-arrow)"/>
    <path d="M490 145 L556 145" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#b-arrow)"/>
    <path d="M490 193 L560 152" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#b-arrow)"/>

    <!-- ci.yml -->
    <rect x="565" y="70" width="365" height="230" rx="8" fill="#161b22" stroke="#2088ff" stroke-width="2"/>
    <text x="585" y="98" fill="#2088ff" font-size="15" font-weight="600">ci.yml</text>
    <text x="910" y="98" fill="#d2a8ff" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="end">permissions: contents: read</text>
    <rect x="585" y="120" width="155" height="160" rx="6" fill="#0d1117" stroke="#2088ff"/>
    <text x="662" y="144" fill="#f0f6fc" font-size="14" font-weight="600" text-anchor="middle">runner-info</text>
    <text x="662" y="164" fill="#8b949e" font-size="12" text-anchor="middle">ubuntu-24.04</text>
    <g font-size="12" fill="#f0f6fc"><text x="600" y="196">· sistema operativo</text><text x="600" y="218">· CPU</text><text x="600" y="240">· memoria</text></g>
    <rect x="755" y="120" width="155" height="160" rx="6" fill="#0d1117" stroke="#2088ff"/>
    <text x="832" y="144" fill="#f0f6fc" font-size="14" font-weight="600" text-anchor="middle">structure</text>
    <text x="832" y="164" fill="#8b949e" font-size="12" text-anchor="middle">ubuntu-24.04</text>
    <g font-size="12" fill="#f0f6fc"><text x="770" y="196">· checkout por SHA</text><text x="770" y="214" fill="#8b949e">  sin credenciales</text><text x="770" y="240">· lockfiles y compose</text><text x="770" y="258" fill="#8b949e">  en su sitio</text></g>
    <text x="747" y="294" fill="#8b949e" font-size="12" text-anchor="middle">dos jobs en paralelo, dos máquinas distintas</text>

    <!-- lo que llega después -->
    <text x="30" y="350" fill="#8b949e" font-size="14" font-weight="600">Lo que llega después</text>
    <g font-size="13" fill="#8b949e">
      <rect x="30" y="366" width="210" height="110" rx="8" fill="#0d1117" stroke="#30363d" stroke-dasharray="6 4"/>
      <text x="50" y="394" font-weight="600">Semana 03</text><text x="50" y="418">ci-api.yml</text><text x="50" y="440">uv, ruff, pytest, caché</text>
      <rect x="260" y="366" width="210" height="110" rx="8" fill="#0d1117" stroke="#30363d" stroke-dasharray="6 4"/>
      <text x="280" y="394" font-weight="600">Semana 04</text><text x="280" y="418">ci-web.yml</text><text x="280" y="440">pnpm, matriz, artefactos</text>
      <rect x="490" y="366" width="210" height="110" rx="8" fill="#0d1117" stroke="#30363d" stroke-dasharray="6 4"/>
      <text x="510" y="394" font-weight="600">Semana 05</text><text x="510" y="418">integración</text><text x="510" y="440">PostgreSQL 17 como service</text>
      <rect x="720" y="366" width="210" height="110" rx="8" fill="#0d1117" stroke="#30363d" stroke-dasharray="6 4"/>
      <text x="740" y="394" font-weight="600">Semana 06</text><text x="740" y="418">images.yml</text><text x="740" y="440">imágenes en GHCR por digest</text>
    </g>
    <text x="480" y="504" fill="#8b949e" font-size="12" text-anchor="middle">En azul, lo que existe al terminar esta semana. En gris discontinuo, lo que añaden las siguientes.</text>
  </g>
</svg>
