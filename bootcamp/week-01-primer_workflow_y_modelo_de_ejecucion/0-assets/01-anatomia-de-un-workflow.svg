<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t01">
  <title id="t01">Anatomía de un workflow: a la izquierda un workflow completo; a la derecha qué responde cada clave: name, on, permissions, jobs, el id del job, runs-on, steps, y los dos tipos de step, run y uses con sus entradas en with</title>
  <rect width="960" height="560" fill="#0d1117"/>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="480" y="36" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">Anatomía de un workflow</text>
    <rect x="20" y="58" width="500" height="474" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="36" y="80" fill="#8b949e" font-size="12">.github/workflows/list-files.yml</text>
    <rect x="30" y="264" width="480" height="242" rx="6" fill="none" stroke="#2088ff" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="44" y="100" fill="#f0f6fc" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">name: list-files</text>
    <line x1="528" y1="96" x2="586" y2="96" stroke="#2088ff" stroke-width="1.5"/>
    <circle cx="592" cy="96" r="4" fill="#2088ff"/>
    <text x="606" y="100" fill="#f0f6fc" font-size="13">name: cómo se llama en la pestaña Actions</text>
    <text x="44" y="126" fill="#f0f6fc" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">on:</text>
    <line x1="528" y1="122" x2="586" y2="122" stroke="#79c0ff" stroke-width="1.5"/>
    <circle cx="592" cy="122" r="4" fill="#79c0ff"/>
    <text x="606" y="126" fill="#f0f6fc" font-size="13">on: qué eventos lo disparan</text>
    <text x="44" y="152" fill="#f0f6fc" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  push:</text>
    <text x="44" y="178" fill="#f0f6fc" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    branches: [main]</text>
    <text x="44" y="204" fill="#f0f6fc" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  workflow_dispatch:</text>
    <text x="44" y="230" fill="#f0f6fc" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">permissions:</text>
    <line x1="528" y1="226" x2="586" y2="226" stroke="#d2a8ff" stroke-width="1.5"/>
    <circle cx="592" cy="226" r="4" fill="#d2a8ff"/>
    <text x="606" y="230" fill="#f0f6fc" font-size="13">permissions: qué puede hacer el GITHUB_TOKEN</text>
    <text x="44" y="256" fill="#f0f6fc" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  contents: read</text>
    <text x="44" y="282" fill="#f0f6fc" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">jobs:</text>
    <line x1="528" y1="278" x2="586" y2="278" stroke="#2088ff" stroke-width="1.5"/>
    <circle cx="592" cy="278" r="4" fill="#2088ff"/>
    <text x="606" y="282" fill="#f0f6fc" font-size="13">jobs: mapa de id a job; corren en paralelo</text>
    <text x="44" y="308" fill="#f0f6fc" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">  list-files:</text>
    <line x1="528" y1="304" x2="586" y2="304" stroke="#2088ff" stroke-width="1.5"/>
    <circle cx="592" cy="304" r="4" fill="#2088ff"/>
    <text x="606" y="308" fill="#f0f6fc" font-size="13">id del job: inglés, kebab-case</text>
    <text x="44" y="334" fill="#f0f6fc" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    runs-on: ubuntu-24.04</text>
    <line x1="528" y1="330" x2="586" y2="330" stroke="#2088ff" stroke-width="1.5"/>
    <circle cx="592" cy="330" r="4" fill="#2088ff"/>
    <text x="606" y="334" fill="#f0f6fc" font-size="13">runs-on: en qué máquina corre</text>
    <text x="44" y="360" fill="#f0f6fc" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">    steps:</text>
    <line x1="528" y1="356" x2="586" y2="356" stroke="#2088ff" stroke-width="1.5"/>
    <circle cx="592" cy="356" r="4" fill="#2088ff"/>
    <text x="606" y="360" fill="#f0f6fc" font-size="13">steps: en orden, en la misma máquina</text>
    <text x="44" y="386" fill="#f0f6fc" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">      - name: Antes del checkout</text>
    <text x="44" y="412" fill="#f0f6fc" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">        run: ls -la</text>
    <line x1="528" y1="408" x2="586" y2="408" stroke="#3fb950" stroke-width="1.5"/>
    <circle cx="592" cy="408" r="4" fill="#3fb950"/>
    <text x="606" y="412" fill="#f0f6fc" font-size="13">run: un comando de shell (bash -e)</text>
    <text x="44" y="438" fill="#f0f6fc" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">      - uses: actions/checkout@3d3c42e…</text>
    <line x1="528" y1="434" x2="586" y2="434" stroke="#3fb950" stroke-width="1.5"/>
    <circle cx="592" cy="434" r="4" fill="#3fb950"/>
    <text x="606" y="438" fill="#f0f6fc" font-size="13">uses: una action, fijada por SHA</text>
    <text x="44" y="464" fill="#f0f6fc" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">        with:</text>
    <text x="44" y="490" fill="#f0f6fc" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" xml:space="preserve">          persist-credentials: false</text>
    <line x1="528" y1="486" x2="586" y2="486" stroke="#d2a8ff" stroke-width="1.5"/>
    <circle cx="592" cy="486" r="4" fill="#d2a8ff"/>
    <text x="606" y="490" fill="#f0f6fc" font-size="13">with: entradas de la action</text>
    <text x="606" y="512" fill="#8b949e" font-size="12">El recuadro discontinuo es un job: una máquina,</text>
    <text x="606" y="528" fill="#8b949e" font-size="12">y sus steps uno tras otro dentro de ella.</text>
  </g>
</svg>
