# Tests unitarios de la API en el runner propio de tablero.
# Se copia a .github/workflows/lab.yml de <tu-org>/tablero.
name: lab
# TODO 7: que solo se pueda lanzar a mano.
on:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions: {}
jobs:
  unit:
    name: Tests unitarios en el runner propio
    # TODO 8: pide el runner propio por sus etiquetas self-hosted y tablero-lab.
    runs-on: ubuntu-24.04
    # TODO 9: techo de tiempo y solo lectura de contents.
    defaults:
      run:
        working-directory: api
    steps:
      - name: Quién ejecuta este job
        run: echo "runner=$RUNNER_NAME work=$RUNNER_WORKSPACE os=$ImageOS"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run --no-sync pytest tests/unit
