<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1010" role="img" aria-labelledby="t17">
  <title id="t17">Mapa del pipeline de tablero en la capa 17. Arriba, la regla de todos los workflows desde la capa 12: permissions vacío en la raíz, permisos por job y ninguna expresión dentro de run. A la izquierda, lo que ya existía y sigue igual: ci-api, ci y ci-web; images; nightly, smoke y lint-workflows; labeler, pr-report, codeql y ci-tools; dependency-review.yml; dependabot.yml; y lab.yml, que sigue usando tablero-runners solo con workflow_dispatch. deploy-gate.yml desaparece: lo sustituye deploy.yml. A la derecha, lo nuevo. release.yml gana el job deploy, que tras release-please e images y con actions write como único permiso lanza deploy.yml con la versión. deploy.yml se lanza solo con workflow_dispatch y run-name deploy con la versión: el job verify en ubuntu-24.04 con attestations read comprueba con gh attestation verify que las imágenes las firmó release.yml en runners de GitHub y saca sus digests; los jobs staging y production corren en tablero-runners, cada uno en su environment, con concurrency sin cancelar, contents read e id-token write, instalan Helm v4.3.2 con checksum, despliegan por digest con --rollback-on-failure, pasan el smoke test y vuelven atrás con helm rollback si falla; production espera a staging y a tu aprobación. deploy/k8s es el chart de tablero, copiado de app, que solo acepta imágenes por digest y cuyos pods corren sin root, sin token, sin escalada ni capacidades, con seccomp y límites; el PVC se conserva. ops/cluster trae authentication-config.yaml, con el emisor de GitHub, audiencia kind-gha y reglas sobre el id del repo, main, deploy.yml y el environment, que se convierte en el usuario; y access.yaml, con los namespaces tablero-staging y tablero-production en Pod Security restricted y un Role por environment. ops/deploy trae un kubeconfig sin credenciales y github-token.sh, el plugin exec que pide el token OIDC con audiencia kind-gha. ops/arc/values.yaml monta el CA del clúster desde kube-root-ca.crt y sigue sin token. En configuración: los environments staging y production con el secreto DATABASE_PASSWORD y production con revisor; el clúster kind-gha recreado con la configuración OIDC del apiserver en ~/.config/tablero-kind, access.yaml aplicado y ARC reinstalado. En gris, lo que llega después: merge queue y rulesets en la Semana 18, rendimiento, coste y observabilidad en la 19 y el capstone en la 20.</title>
