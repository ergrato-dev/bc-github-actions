      <text x="378" y="330" fill="#d2a8ff">attestations: read</text>
      <text x="378" y="354" fill="#f0f6fc">gh attestation</text>
      <text x="391.2" y="370" fill="#f0f6fc">verify</text>
      <text x="378" y="388" fill="#3fb950">--signer-workflow</text>
      <text x="391.2" y="404" fill="#3fb950">release.yml</text>
      <text x="378" y="420" fill="#3fb950">--deny-self-hosted</text>
      <text x="378" y="446" fill="#79c0ff">outputs: api · web</text>
      <text x="391.2" y="462" fill="#79c0ff">@sha256:…</text>

      <rect x="552" y="274" width="362" height="196" rx="6" fill="#0d1117" stroke="#2088ff"/>
      <text x="564" y="294" fill="#f0f6fc" font-size="12" font-weight="600">staging → production</text>
      <text x="902" y="294" fill="#3fb950" text-anchor="end">runs-on: tablero-runners</text>
      <text x="564" y="314" fill="#e3b341">environment: staging · production</text>
      <text x="564" y="330" fill="#8b949e">concurrency: deploy-&lt;env&gt; · sin cancelar</text>
      <text x="564" y="346" fill="#d2a8ff">contents: read · id-token: write</text>
      <text x="564" y="370" fill="#f0f6fc">KUBECONFIG: ops/deploy/kubeconfig.yaml</text>
      <text x="564" y="388" fill="#3fb950">Helm v4.3.2 · sha256sum -c</text>
      <text x="564" y="406" fill="#f0f6fc">helm upgrade --install · por digest</text>
      <text x="577.2" y="422" fill="#f0f6fc">--rollback-on-failure --timeout 3m</text>
      <text x="564" y="440" fill="#f0f6fc">smoke-test.sh · web.&lt;ns&gt;.svc</text>
      <text x="564" y="458" fill="#f85149">si falla: helm rollback</text>
      <text x="902" y="458" fill="#e3b341" text-anchor="end">production: tu aprobación</text>
    </g>
