<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="t01">
  <title id="t01">Cadena de despliegue de tablero. Al fusionar el PR de release, release.yml ejecuta release-please, construye y firma las imágenes y, en su job deploy con actions write como único permiso, lanza deploy.yml con gh workflow run y la versión publicada. La release creada con GITHUB_TOKEN no dispara on release; workflow_dispatch sí. deploy.yml también se lanza a mano para redesplegar o volver a una versión anterior. Dentro de deploy.yml, el job verify en ubuntu-24.04 con attestations read valida la versión y comprueba con gh attestation verify que las imágenes las firmó release.yml en runners de GitHub, y devuelve los dos digests. El job staging, en tablero-runners y en el environment staging, despliega esos digests con Helm en el namespace tablero-staging, pasa el smoke test y vuelve atrás si falla. Tras la aprobación del revisor, el job production despliega los mismos digests en tablero-production.</title>
  <rect width="960" height="640" fill="#0d1117"/>
  <defs>
    <marker id="a01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#79c0ff"/></marker>
    <marker id="g01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker>
  </defs>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="480" y="36" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">De una release a production</text>

    <!-- PR -->
    <rect x="30" y="70" width="160" height="110" rx="8" fill="#161b22" stroke="#79c0ff" stroke-width="2"/>
    <text x="110" y="104" fill="#79c0ff" font-size="13" font-weight="600" text-anchor="middle">PR de release</text>
    <text x="110" y="124" fill="#79c0ff" font-size="13" font-weight="600" text-anchor="middle">fusionado</text>
    <text x="110" y="156" fill="#8b949e" font-size="11" text-anchor="middle">push a main</text>
    <path d="M190 125 L222 125" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#a01)"/>

    <!-- release.yml -->
    <rect x="230" y="70" width="450" height="110" rx="8" fill="#161b22" stroke="#2088ff" stroke-width="2"/>
    <text x="246" y="92" fill="#2088ff" font-size="13" font-weight="600">release.yml</text>
    <text x="664" y="92" fill="#8b949e" font-size="11" text-anchor="end">ubuntu-24.04</text>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">
      <rect x="246" y="104" width="120" height="60" rx="6" fill="#0d1117" stroke="#30363d"/>
      <text x="306" y="130" fill="#f0f6fc" text-anchor="middle">release-please</text>
      <text x="306" y="148" fill="#8b949e" text-anchor="middle">vX.Y.Z</text>
      <rect x="386" y="104" width="120" height="60" rx="6" fill="#0d1117" stroke="#3fb950"/>
      <text x="446" y="130" fill="#f0f6fc" text-anchor="middle">images</text>
      <text x="446" y="148" fill="#3fb950" text-anchor="middle">firmadas</text>
      <rect x="526" y="104" width="138" height="60" rx="6" fill="#0d1117" stroke="#2088ff"/>
      <text x="595" y="126" fill="#f0f6fc" text-anchor="middle">deploy</text>
      <text x="595" y="142" fill="#d2a8ff" text-anchor="middle">actions: write</text>
      <text x="595" y="157" fill="#79c0ff" text-anchor="middle">gh workflow run</text>
    </g>
    <path d="M366 134 L382 134" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#a01)"/>
    <path d="M506 134 L522 134" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#a01)"/>

    <!-- a mano -->
    <rect x="720" y="70" width="210" height="110" rx="8" fill="#0d1117" stroke="#30363d" stroke-dasharray="6 4"/>
    <text x="736" y="94" fill="#f0f6fc" font-size="13" font-weight="600">Tú, a mano</text>
    <text x="736" y="118" fill="#f0f6fc" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace">gh workflow run deploy.yml</text>
    <text x="749.2" y="136" fill="#f0f6fc" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace">-f version=1.3.2</text>
    <text x="736" y="162" fill="#8b949e" font-size="11">redesplegar o volver atrás</text>

    <!-- flechas a deploy.yml -->
    <path d="M595 180 L595 232" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#a01)"/>
    <text x="585" y="212" fill="#79c0ff" font-size="11" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">workflow_dispatch · version=X.Y.Z</text>
    <path d="M825 180 L825 232" stroke="#79c0ff" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#a01)"/>

    <!-- nota on release -->
    <text x="30" y="212" fill="#f85149" font-size="11"><tspan font-family="ui-monospace, Menlo, Consolas, monospace">on: release</tspan> no se dispara: la release la crea GITHUB_TOKEN</text>

    <!-- deploy.yml -->
    <rect x="30" y="240" width="900" height="250" rx="8" fill="#161b22" stroke="#2088ff" stroke-width="2"/>
    <text x="46" y="264" fill="#2088ff" font-size="14" font-weight="600">deploy.yml</text>
    <text x="914" y="264" fill="#8b949e" font-size="11" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace">run-name: deploy X.Y.Z</text>

    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">
      <!-- verify -->
      <rect x="46" y="282" width="200" height="190" rx="6" fill="#0d1117" stroke="#3fb950"/>
      <text x="58" y="304" fill="#f0f6fc" font-size="12" font-weight="600">verify</text>
      <text x="58" y="324" fill="#8b949e">ubuntu-24.04</text>
      <text x="58" y="340" fill="#d2a8ff">attestations: read</text>
      <text x="58" y="364" fill="#f0f6fc">version ~ X.Y.Z</text>
      <text x="58" y="382" fill="#f0f6fc">gh attestation verify</text>
      <text x="71.2" y="398" fill="#3fb950">firmó release.yml</text>
      <text x="71.2" y="414" fill="#3fb950">runner de GitHub</text>
      <text x="58" y="440" fill="#79c0ff">api@sha256:…</text>
      <text x="58" y="456" fill="#79c0ff">web@sha256:…</text>

      <!-- staging -->
      <rect x="290" y="282" width="250" height="190" rx="6" fill="#0d1117" stroke="#2088ff"/>
      <text x="302" y="304" fill="#f0f6fc" font-size="12" font-weight="600">staging</text>
      <text x="528" y="304" fill="#e3b341" text-anchor="end">env: staging</text>
      <text x="302" y="324" fill="#8b949e">tablero-runners</text>
      <text x="302" y="340" fill="#d2a8ff">id-token: write</text>
      <text x="302" y="364" fill="#f0f6fc">helm upgrade --install</text>
      <text x="315.2" y="380" fill="#f0f6fc">--rollback-on-failure</text>
      <text x="302" y="398" fill="#f0f6fc">smoke-test.sh</text>
      <text x="302" y="416" fill="#f85149">si falla: helm rollback</text>
      <text x="302" y="440" fill="#8b949e">concurrency: deploy-staging</text>
      <text x="302" y="456" fill="#8b949e">cancel-in-progress: false</text>

      <!-- aprobación -->
      <rect x="576" y="340" width="90" height="74" rx="6" fill="#0d1117" stroke="#e3b341" stroke-width="2"/>
      <text x="621" y="368" fill="#e3b341" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">tu</text>
      <text x="621" y="386" fill="#e3b341" text-anchor="middle" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">aprobación</text>

      <!-- production -->
      <rect x="700" y="282" width="214" height="190" rx="6" fill="#0d1117" stroke="#2088ff"/>
      <text x="712" y="304" fill="#f0f6fc" font-size="12" font-weight="600">production</text>
      <text x="712" y="324" fill="#8b949e">tablero-runners</text>
      <text x="712" y="340" fill="#e3b341">env: production</text>
      <text x="712" y="364" fill="#f0f6fc">needs: [verify,</text>
      <text x="764.8" y="380" fill="#f0f6fc">staging]</text>
      <text x="712" y="398" fill="#f0f6fc">mismos digests</text>
      <text x="712" y="416" fill="#f0f6fc">helm · smoke · rollback</text>
      <text x="712" y="440" fill="#8b949e">concurrency:</text>
      <text x="725.2" y="456" fill="#8b949e">deploy-production</text>
    </g>
    <path d="M246 377 L286 377" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#a01)"/>
    <path d="M540 377 L572 377" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#a01)"/>
    <path d="M666 377 L696 377" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#a01)"/>
    <!-- digests a production por needs -->
    <path d="M146 472 L146 482 L807 482 L807 476" stroke="#79c0ff" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#a01)"/>

    <!-- namespaces -->
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">
      <rect x="290" y="530" width="250" height="56" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
      <text x="415" y="554" fill="#3fb950" text-anchor="middle">tablero-staging</text>
      <text x="415" y="574" fill="#8b949e" font-size="11" text-anchor="middle">db · api · web por digest</text>
      <rect x="700" y="530" width="214" height="56" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
      <text x="807" y="554" fill="#3fb950" text-anchor="middle">tablero-production</text>
      <text x="807" y="574" fill="#8b949e" font-size="11" text-anchor="middle">db · api · web por digest</text>
    </g>
    <path d="M415 490 L415 526" stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#g01)"/>
    <path d="M807 490 L807 526" stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#g01)"/>
    <text x="46" y="554" fill="#8b949e" font-size="11">kind-gha · solo se llega</text>
    <text x="46" y="572" fill="#8b949e" font-size="11">desde dentro del clúster</text>

    <text x="480" y="616" fill="#8b949e" font-size="11" text-anchor="middle">Azul: workflows y jobs. Verde: lo verificado y lo desplegado. Amarillo: environments y aprobación. Morado: permisos. Rojo: lo que no funciona o se deshace.</text>
  </g>
</svg>
