# Starter de la Semana 17: se copia a ops/deploy/kubeconfig.yaml de <tu-org>/tablero.
apiVersion: v1
kind: Config
clusters:
  - name: kind-gha
    cluster:
      server: https://kubernetes.default.svc
      certificate-authority: /etc/kube-ca/ca.crt
users:
  - name: github-oidc
    user:
      # TODO 16: ninguna credencial aquí; que la entregue ./github-token.sh como plugin exec
      token: <TOKEN>
contexts:
  - name: deploy
    context:
      cluster: kind-gha
      user: github-oidc
current-context: deploy
