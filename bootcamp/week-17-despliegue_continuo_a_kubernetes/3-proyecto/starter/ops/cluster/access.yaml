# Starter de la Semana 17: se copia a ops/cluster/access.yaml de <tu-org>/tablero y lo aplicas tú,
# con tu contexto de administración de kind-gha: kubectl --context kind-gha apply -f ...
apiVersion: v1
kind: Namespace
metadata:
  name: tablero-staging
  # TODO 13: Pod Security restricted en los dos namespaces
---
apiVersion: v1
kind: Namespace
metadata:
  name: tablero-production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: tablero-staging
rules:
  # TODO 14: solo lo que crea el chart y lo que Helm necesita leer, sin comodines (los dos Roles)
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: tablero-production
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: tablero-staging
subjects:
  - kind: User
    name: github:staging
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: deployer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: tablero-production
subjects:
  # TODO 15: cada environment es su propio usuario
  - kind: User
    name: github:staging
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: deployer
  apiGroup: rbac.authorization.k8s.io
