<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="t02">
  <title id="t02">Qué pasa en el runner durante un build con buildx. actions/checkout deja la carpeta api en el disco. setup-buildx-action crea un builder BuildKit con el driver docker-container, que corre en su propio contenedor, separado del Docker Engine del runner. login-action guarda la credencial del GITHUB_TOKEN en el config.json de Docker. build-push-action manda el contexto api al builder, que lee la caché type=gha con cache-from y la escribe con cache-to en la caché de Actions del repo, con un índice por scope y blobs compartidos. Según los inputs, el resultado va a GHCR con push true, al Docker del runner con load true, o se queda solo en la caché del builder si los dos valen false. El step devuelve los outputs digest, imageid y metadata y escribe el resumen de build</title>
  <rect width="960" height="620" fill="#0d1117"/>
  <defs>
    <marker id="a02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#79c0ff"/></marker>
    <marker id="a02g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker>
    <marker id="a02p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d2a8ff"/></marker>
  </defs>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="480" y="36" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">buildx en el runner: builder, caché y destino</text>

    <!-- runner -->
    <rect x="30" y="60" width="600" height="520" rx="10" fill="#0d1117" stroke="#30363d"/>
    <text x="50" y="86" fill="#8b949e" font-size="13" font-weight="600">runner ubuntu-24.04</text>

    <!-- steps -->
    <g font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">
      <rect x="50" y="104" width="250" height="40" rx="6" fill="#161b22" stroke="#30363d"/>
      <text x="64" y="129" fill="#f0f6fc">actions/checkout</text>
      <rect x="50" y="154" width="250" height="40" rx="6" fill="#161b22" stroke="#2088ff"/>
      <text x="64" y="179" fill="#f0f6fc">docker/setup-buildx-action</text>
      <rect x="50" y="204" width="250" height="40" rx="6" fill="#161b22" stroke="#d2a8ff"/>
      <text x="64" y="229" fill="#f0f6fc">docker/login-action</text>
      <rect x="50" y="254" width="250" height="40" rx="6" fill="#161b22" stroke="#2088ff" stroke-width="2"/>
      <text x="64" y="279" fill="#f0f6fc">docker/build-push-action</text>
    </g>

    <!-- disco -->
    <rect x="50" y="330" width="250" height="80" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="64" y="352" fill="#8b949e" font-size="12">disco del runner</text>
    <text x="64" y="374" fill="#f0f6fc" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">api/ web/</text>
    <text x="180" y="374" fill="#8b949e" font-size="12">← checkout</text>
    <text x="64" y="396" fill="#d2a8ff" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">config.json</text>
    <text x="180" y="396" fill="#8b949e" font-size="12">← login</text>

    <!-- builder -->
    <rect x="350" y="104" width="260" height="190" rx="8" fill="#161b22" stroke="#2088ff" stroke-width="2"/>
    <text x="480" y="130" fill="#2088ff" font-size="15" font-weight="600" text-anchor="middle">Builder BuildKit</text>
    <text x="480" y="150" fill="#8b949e" font-size="12" text-anchor="middle">driver docker-container</text>
    <text x="480" y="168" fill="#8b949e" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">contenedor buildx_buildkit_…</text>
    <rect x="370" y="182" width="220" height="44" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="480" y="202" fill="#f0f6fc" font-size="12" text-anchor="middle">ejecuta el Dockerfile</text>
    <text x="480" y="218" fill="#8b949e" font-size="11" text-anchor="middle">etapas en paralelo, CACHED o rehecho</text>
    <rect x="370" y="236" width="220" height="44" rx="5" fill="#0d1117" stroke="#30363d"/>
    <text x="480" y="256" fill="#f0f6fc" font-size="12" text-anchor="middle">caché propia del builder</text>
    <text x="480" y="272" fill="#8b949e" font-size="11" text-anchor="middle">se borra al acabar el job</text>

    <path d="M300 174 C 325 174, 325 140, 346 140" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#a02)"/>
    <text x="326" y="190" fill="#79c0ff" font-size="10" text-anchor="middle">crea</text>
    <path d="M300 274 L346 274" stroke="#79c0ff" stroke-width="2" marker-end="url(#a02)"/>
    <text x="323" y="266" fill="#79c0ff" font-size="10" text-anchor="middle">contexto</text>

    <!-- docker engine -->
    <rect x="350" y="330" width="260" height="80" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="480" y="356" fill="#f0f6fc" font-size="14" font-weight="600" text-anchor="middle">Docker Engine del runner</text>
    <text x="480" y="378" fill="#8b949e" font-size="12" text-anchor="middle">docker images · docker run</text>
    <text x="480" y="398" fill="#8b949e" font-size="11" text-anchor="middle">el builder no escribe aquí si no hay load</text>
    <path d="M440 294 L440 326" stroke="#79c0ff" stroke-width="2" marker-end="url(#a02)"/>
    <text x="448" y="316" fill="#79c0ff" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">load: true</text>

    <!-- destino ninguno -->
    <rect x="50" y="440" width="560" height="120" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="70" y="466" fill="#f0f6fc" font-size="14" font-weight="600">Lo que devuelve el step</text>
    <g font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="70" y="490" fill="#3fb950">outputs: digest · imageid · metadata</text>
      <text x="70" y="512" fill="#f0f6fc">resumen de build + artefacto .dockerbuild</text>
      <text x="70" y="540" fill="#8b949e">push: false y load: false → solo comprueba que construye</text>
    </g>

    <!-- GHCR -->
    <rect x="680" y="70" width="250" height="130" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="805" y="96" fill="#3fb950" font-size="15" font-weight="600" text-anchor="middle">GHCR · ghcr.io</text>
    <g font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">
      <rect x="700" y="108" width="210" height="30" rx="5" fill="#0d1117" stroke="#30363d"/>
      <text x="714" y="128" fill="#f0f6fc">&lt;tu-org&gt;/tablero-api</text>
      <rect x="700" y="146" width="210" height="30" rx="5" fill="#0d1117" stroke="#30363d"/>
      <text x="714" y="166" fill="#f0f6fc">&lt;tu-org&gt;/tablero-web</text>
    </g>
    <text x="805" y="192" fill="#8b949e" font-size="11" text-anchor="middle">credencial: GITHUB_TOKEN</text>
    <path d="M610 140 L676 140" stroke="#3fb950" stroke-width="2" marker-end="url(#a02g)"/>
    <text x="645" y="132" fill="#3fb950" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">push</text>

    <!-- cache gha -->
    <rect x="680" y="220" width="250" height="200" rx="10" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
    <text x="805" y="246" fill="#d2a8ff" font-size="15" font-weight="600" text-anchor="middle">Caché de Actions</text>
    <text x="805" y="264" fill="#8b949e" font-size="11" text-anchor="middle">la del repo: 10 GB, 7 días sin uso</text>
    <g font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">
      <rect x="700" y="280" width="100" height="34" rx="5" fill="#0d1117" stroke="#d2a8ff"/>
      <text x="750" y="302" fill="#f0f6fc" text-anchor="middle">index-api</text>
      <rect x="810" y="280" width="100" height="34" rx="5" fill="#0d1117" stroke="#d2a8ff"/>
      <text x="860" y="302" fill="#f0f6fc" text-anchor="middle">index-web</text>
      <rect x="700" y="324" width="210" height="34" rx="5" fill="#0d1117" stroke="#30363d"/>
      <text x="805" y="346" fill="#f0f6fc" text-anchor="middle">buildkit-blob-1-sha256:…</text>
    </g>
    <text x="805" y="384" fill="#8b949e" font-size="11" text-anchor="middle">un índice por scope; blobs compartidos</text>
    <text x="805" y="402" fill="#8b949e" font-size="11" text-anchor="middle">por digest entre las dos imágenes</text>

    <path d="M676 240 L614 240" stroke="#d2a8ff" stroke-width="2" marker-end="url(#a02p)"/>
    <text x="645" y="232" fill="#d2a8ff" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">cache-from</text>
    <path d="M610 276 L676 276" stroke="#d2a8ff" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a02p)"/>
    <text x="645" y="292" fill="#d2a8ff" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">cache-to</text>

    <text x="480" y="606" fill="#8b949e" font-size="12" text-anchor="middle">En azul, el builder y el flujo del build. En verde, la publicación. En morado, credencial y caché.</text>
  </g>
</svg>
