<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t02">
  <title id="t02">Recorrido de un job hasta un environment protegido, de izquierda a derecha. El job production de deploy-gate declara environment production. Primera puerta, ramas permitidas: si la ref no es main, el job falla en el acto con el mensaje Branch is not allowed to deploy due to environment protection rules, sin nada que aprobar. Segunda puerta, revisores obligatorios: el job pasa a Waiting, no ocupa runner ni consume minutos, y basta la aprobación de uno de hasta seis revisores, desde la UI o con un POST a pending_deployments con environment_ids, state y comment; si se rechaza, el job termina en failure; si nadie decide, caduca a los 30 días. Tercera puerta, wait timer opcional de 1 a 43.200 minutos. Solo entonces arranca el job y el runner recibe los secretos y las variables del environment, como DATABASE_PASSWORD y OIDC_SUB. Abajo, la concurrencia: con cancel-in-progress false, un segundo run espera en Pending mientras el anterior espera aprobación, y un tercero sustituye al que estaba en cola.</title>
  <rect width="960" height="560" fill="#0d1117"/>
  <defs>
    <marker id="a02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2088ff"/></marker>
    <marker id="r02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker>
  </defs>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="480" y="36" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">Un job hasta un environment protegido</text>

    <!-- job -->
    <rect x="20" y="80" width="150" height="110" rx="8" fill="#161b22" stroke="#2088ff" stroke-width="2"/>
    <text x="95" y="108" fill="#2088ff" font-size="14" font-weight="600" text-anchor="middle">job production</text>
    <text x="95" y="134" fill="#79c0ff" font-size="11" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">environment:</text>
    <text x="95" y="152" fill="#79c0ff" font-size="11" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">production</text>
    <text x="95" y="176" fill="#8b949e" font-size="11" text-anchor="middle">needs: staging</text>

    <!-- puerta 1 -->
    <rect x="200" y="80" width="170" height="110" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <text x="285" y="106" fill="#f0f6fc" font-size="13" font-weight="600" text-anchor="middle">1 · Rama permitida</text>
    <text x="285" y="132" fill="#8b949e" font-size="11" text-anchor="middle">custom_branch_policies</text>
    <text x="285" y="152" fill="#79c0ff" font-size="11" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">{name: main}</text>
    <text x="285" y="176" fill="#8b949e" font-size="11" text-anchor="middle">* no cruza /</text>

    <!-- puerta 2 -->
    <rect x="400" y="80" width="190" height="110" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <text x="495" y="106" fill="#f0f6fc" font-size="13" font-weight="600" text-anchor="middle">2 · Revisores</text>
    <text x="495" y="130" fill="#e3b341" font-size="12" text-anchor="middle" font-weight="600">Waiting</text>
    <text x="495" y="152" fill="#8b949e" font-size="11" text-anchor="middle">sin runner · sin minutos</text>
    <text x="495" y="176" fill="#8b949e" font-size="11" text-anchor="middle">basta 1 de hasta 6</text>

    <!-- puerta 3 -->
    <rect x="620" y="80" width="150" height="110" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="695" y="106" fill="#f0f6fc" font-size="13" font-weight="600" text-anchor="middle">3 · Wait timer</text>
    <text x="695" y="134" fill="#8b949e" font-size="11" text-anchor="middle">opcional</text>
    <text x="695" y="156" fill="#8b949e" font-size="11" text-anchor="middle">1 a 43.200 min</text>

    <!-- arranca -->
    <rect x="800" y="80" width="140" height="110" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="870" y="106" fill="#3fb950" font-size="13" font-weight="600" text-anchor="middle">4 · Arranca</text>
    <text x="870" y="130" fill="#d2a8ff" font-size="10" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">secrets.</text>
    <text x="870" y="146" fill="#d2a8ff" font-size="10" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">DATABASE_PASSWORD</text>
    <text x="870" y="168" fill="#d2a8ff" font-size="10" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">vars.OIDC_SUB</text>

    <g stroke="#2088ff" stroke-width="2" fill="none" marker-end="url(#a02)">
      <path d="M170 135 L196 135"/>
      <path d="M370 135 L396 135"/>
      <path d="M590 135 L616 135"/>
      <path d="M770 135 L796 135"/>
    </g>

    <!-- fallos -->
    <g stroke="#f85149" stroke-width="2" fill="none" marker-end="url(#r02)">
      <path d="M285 190 L285 236"/>
      <path d="M495 190 L495 236"/>
    </g>
    <rect x="190" y="240" width="190" height="78" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="285" y="264" fill="#f85149" font-size="12" font-weight="600" text-anchor="middle">otra rama: falla ya</text>
    <text x="285" y="286" fill="#8b949e" font-size="10" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">Branch "x" is not allowed</text>
    <text x="285" y="302" fill="#8b949e" font-size="10" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">to deploy to production...</text>
    <rect x="400" y="240" width="190" height="78" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="495" y="264" fill="#f85149" font-size="12" font-weight="600" text-anchor="middle">rechazado: failure</text>
    <text x="495" y="286" fill="#8b949e" font-size="11" text-anchor="middle">sin decisión: caduca</text>
    <text x="495" y="302" fill="#8b949e" font-size="11" text-anchor="middle">a los 30 días</text>

    <!-- api -->
    <rect x="620" y="226" width="320" height="104" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="636" y="250" fill="#f0f6fc" font-size="12" font-weight="600">Aprobar sin abrir la UI</text>
    <g font-size="10.5" font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="636" y="272" fill="#79c0ff">GET  .../runs/$RUN/pending_deployments</text>
      <text x="636" y="292" fill="#3fb950">POST .../runs/$RUN/pending_deployments</text>
      <text x="652" y="310" fill="#8b949e">environment_ids[] · state=approved</text>
      <text x="652" y="324" fill="#8b949e">comment (obligatorio)</text>
    </g>
    <path d="M620 270 L594 160" stroke="#3fb950" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#a02)"/>

    <!-- concurrencia -->
    <text x="20" y="378" fill="#f0f6fc" font-size="14" font-weight="600">concurrency: {group: deploy-gate, cancel-in-progress: false}</text>
    <g font-size="12">
      <rect x="20" y="394" width="290" height="70" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
      <text x="36" y="420" fill="#f0f6fc" font-weight="600">Run 1</text>
      <text x="36" y="444" fill="#e3b341">production en Waiting</text>
      <rect x="335" y="394" width="290" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="351" y="420" fill="#f0f6fc" font-weight="600">Run 2</text>
      <text x="351" y="444" fill="#8b949e">Pending: espera a que acabe el 1</text>
      <rect x="650" y="394" width="290" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-dasharray="6 4"/>
      <text x="666" y="420" fill="#f0f6fc" font-weight="600">Run 3</text>
      <text x="666" y="444" fill="#8b949e">sustituye al 2 en la cola</text>
    </g>

    <text x="480" y="508" fill="#8b949e" font-size="11" text-anchor="middle">Amarillo: puertas que hacen esperar. Rojo: el job no llega a arrancar. Verde: el job recibe los secretos y variables del environment.</text>
    <text x="480" y="526" fill="#8b949e" font-size="11" text-anchor="middle">Nada del environment llega al runner antes del paso 4.</text>
  </g>
</svg>
