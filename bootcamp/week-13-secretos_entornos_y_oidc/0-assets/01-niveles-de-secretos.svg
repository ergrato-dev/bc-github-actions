<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="t01">
  <title id="t01">Niveles de secretos de GitHub Actions y quién los recibe. A la izquierda, tres niveles apilados de arriba abajo: organización, con visibilidad all, private o selected, y para tablero, que es público, selected; repositorio, que reciben todos los jobs del repo; y environment, que solo reciben los jobs que declaran ese environment y después de pasar sus reglas. Una flecha indica la precedencia: si el mismo nombre existe en varios niveles gana el más bajo, environment sobre repo y repo sobre org. A la derecha, qué recibe cada ejecución: un job con environment staging recibe el secreto de staging; un job sin environment recibe el de repo; si el nombre solo existe en staging, el job sin environment recibe una cadena vacía, sin error; un PR desde un fork no recibe ningún secreto salvo un GITHUB_TOKEN de solo lectura; un run de Dependabot solo recibe secretos de Dependabot.</title>
  <rect width="960" height="620" fill="#0d1117"/>
  <defs>
    <marker id="a01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#79c0ff"/></marker>
  </defs>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="480" y="36" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">Niveles de secretos y quién los recibe</text>

    <text x="250" y="72" fill="#8b949e" font-size="12" font-weight="600" text-anchor="middle">Dónde vive el secreto</text>
    <text x="710" y="72" fill="#8b949e" font-size="12" font-weight="600" text-anchor="middle">Qué recibe cada ejecución con SHADOW_DEMO</text>

    <!-- niveles -->
    <rect x="70" y="86" width="400" height="104" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
    <text x="86" y="112" fill="#d2a8ff" font-size="14" font-weight="600">Organización</text>
    <text x="86" y="136" fill="#f0f6fc" font-size="12">visibilidad: all · private · selected</text>
    <text x="86" y="156" fill="#e3b341" font-size="12">gh secret set --org usa private por defecto</text>
    <text x="86" y="176" fill="#3fb950" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">--visibility selected --repos tablero</text>

    <rect x="70" y="210" width="400" height="84" rx="8" fill="#161b22" stroke="#2088ff" stroke-width="2"/>
    <text x="86" y="236" fill="#2088ff" font-size="14" font-weight="600">Repositorio</text>
    <text x="86" y="260" fill="#f0f6fc" font-size="12">lo recibe cualquier job de cualquier workflow</text>
    <text x="86" y="280" fill="#8b949e" font-size="12">que lo referencie con secrets.NOMBRE</text>

    <rect x="70" y="314" width="400" height="104" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="86" y="340" fill="#3fb950" font-size="14" font-weight="600">Environment · staging · production</text>
    <text x="86" y="364" fill="#f0f6fc" font-size="12">solo jobs con environment: staging</text>
    <text x="86" y="384" fill="#f0f6fc" font-size="12">y solo después de pasar sus reglas</text>
    <text x="86" y="404" fill="#8b949e" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">DATABASE_PASSWORD vive aquí</text>

    <!-- precedencia -->
    <path d="M40 96 L40 410" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#a01)"/>
    <text x="30" y="250" fill="#79c0ff" font-size="12" font-weight="600" text-anchor="middle" transform="rotate(-90 30 250)">gana el nivel más bajo</text>

    <!-- receptores -->
    <g font-size="12">
      <rect x="510" y="86" width="420" height="58" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="526" y="110" fill="#f0f6fc" font-weight="600">Job con environment: staging</text>
      <text x="526" y="130" fill="#3fb950" font-family="ui-monospace, Menlo, Consolas, monospace">el de staging (si existe), si no el de repo</text>

      <rect x="510" y="154" width="420" height="58" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="526" y="178" fill="#f0f6fc" font-weight="600">Job sin environment</text>
      <text x="526" y="198" fill="#2088ff" font-family="ui-monospace, Menlo, Consolas, monospace">el de repo, si no el de org</text>

      <rect x="510" y="222" width="420" height="58" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
      <text x="526" y="246" fill="#f0f6fc" font-weight="600">Job sin environment, nombre solo en staging</text>
      <text x="526" y="266" fill="#e3b341" font-family="ui-monospace, Menlo, Consolas, monospace">"" · cadena vacía, sin error</text>

      <rect x="510" y="290" width="420" height="58" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
      <text x="526" y="314" fill="#f0f6fc" font-weight="600">pull_request desde un fork</text>
      <text x="526" y="334" fill="#f85149" font-family="ui-monospace, Menlo, Consolas, monospace">ningún secreto · GITHUB_TOKEN de lectura</text>

      <rect x="510" y="358" width="420" height="58" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
      <text x="526" y="382" fill="#f0f6fc" font-weight="600">Run lanzado por Dependabot</text>
      <text x="526" y="402" fill="#f85149" font-family="ui-monospace, Menlo, Consolas, monospace">solo los secretos de Dependabot</text>
    </g>

    <!-- variables -->
    <rect x="70" y="448" width="860" height="90" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-dasharray="6 4"/>
    <text x="86" y="474" fill="#d2a8ff" font-size="14" font-weight="600">Variables (vars): mismos tres niveles, misma precedencia</text>
    <text x="86" y="498" fill="#f0f6fc" font-size="12">No se cifran ni se redactan en el log. Para configuración: una URL, un nombre de clúster,</text>
    <text x="86" y="518" fill="#f0f6fc" font-size="12">el sub esperado de un token OIDC (<tspan font-family="ui-monospace, Menlo, Consolas, monospace">vars.OIDC_SUB</tspan>). Si filtrarlo no obliga a rotar nada, es una variable.</text>

    <text x="480" y="574" fill="#8b949e" font-size="11" text-anchor="middle">Morado: configuración de la org y variables. Azul: repo. Verde: environment, el alcance más estrecho.</text>
    <text x="480" y="592" fill="#8b949e" font-size="11" text-anchor="middle">Amarillo: el caso que no da error. Rojo: ejecuciones que no reciben tus secretos.</text>
  </g>
</svg>
