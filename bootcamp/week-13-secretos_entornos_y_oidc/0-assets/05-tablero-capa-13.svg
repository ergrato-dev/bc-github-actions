<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" role="img" aria-labelledby="t13">
  <title id="t13">Mapa del pipeline de tablero en la capa 13. Arriba, la regla que siguen todos los workflows desde la capa 12: permissions vacío en la raíz, permisos por job y ninguna expresión dentro de run; secretos y variables llegan por env. A la izquierda, los workflows que ya existían, sin cambios: ci-api, ci y ci-web con contents read, images con packages write, nightly con actions write, smoke, lint-workflows con zizmor online, labeler y pr-report con pull-requests write y codeql con security-events write. A la derecha, lo nuevo: deploy-gate.yml en push a main y workflow_dispatch, con concurrency sin cancelación y shell bash con pipefail; el job staging y, con needs, el job production, cada uno con su environment, contents read e id-token write, un PostgreSQL de servicio con la contraseña de su environment, migraciones y el token OIDC pasado por un pipe a oidc-verifier con audiencia tablero-verifier, el sub de vars.OIDC_SUB y los claims ref main y runner github-hosted. ci-tools.yml llama a _python.yml del repo central para tools/oidc-verifier, sin integración. tools/oidc-verifier, copiado de app, con PyJWT y cryptography. dependabot.yml vigila con uv también /tools/oidc-verifier. Abajo, los environments: staging, solo desde main, con DATABASE_PASSWORD y OIDC_SUB propios; production, igual más un revisor obligatorio. Y en el repo, la plantilla del sub con repo, context y job_workflow_ref, sin DATABASE_PASSWORD a nivel de repo. En gris, lo que llega después: releases y attestations en la Semana 14, runners propios en la 15 y el despliegue real a Kubernetes en la 17.</title>
  <rect width="960" height="900" fill="#0d1117"/>
  <defs>
    <marker id="a13" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#79c0ff"/></marker>
  </defs>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="480" y="36" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">tablero · capa 13</text>

    <!-- regla común -->
    <rect x="30" y="58" width="900" height="44" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="46" y="85" fill="#3fb950" font-size="12" font-weight="600">en todos los workflows</text>
    <text x="210" y="85" fill="#f0f6fc" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">permissions: {} en la raíz · permisos por job · secrets y vars por env:</text>

    <text x="30" y="134" fill="#f0f6fc" font-size="14" font-weight="600">Ya existían · sin cambios</text>
    <text x="930" y="134" fill="#2088ff" font-size="14" font-weight="600" text-anchor="end">Nuevos en la capa 13</text>

    <!-- existentes -->
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">
      <rect x="30" y="146" width="330" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="46" y="171" fill="#f0f6fc" font-size="12" font-weight="600">ci-api · ci · ci-web</text>
      <text x="344" y="171" fill="#8b949e" text-anchor="end">contents: read</text>

      <rect x="30" y="194" width="330" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="46" y="219" fill="#f0f6fc" font-size="12" font-weight="600">images</text>
      <text x="344" y="219" fill="#e3b341" text-anchor="end">packages: write</text>

      <rect x="30" y="242" width="330" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="46" y="267" fill="#f0f6fc" font-size="12" font-weight="600">nightly</text>
      <text x="344" y="267" fill="#e3b341" text-anchor="end">actions: write</text>

      <rect x="30" y="290" width="330" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="46" y="315" fill="#f0f6fc" font-size="12" font-weight="600">smoke · lint-workflows</text>
      <text x="344" y="315" fill="#8b949e" text-anchor="end">zizmor online</text>

      <rect x="30" y="338" width="330" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="46" y="363" fill="#f0f6fc" font-size="12" font-weight="600">labeler · pr-report</text>
      <text x="344" y="363" fill="#e3b341" text-anchor="end">pull-requests: write</text>

      <rect x="30" y="386" width="330" height="40" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="46" y="411" fill="#f0f6fc" font-size="12" font-weight="600">codeql</text>
      <text x="344" y="411" fill="#e3b341" text-anchor="end">security-events: write</text>
    </g>

    <!-- deploy-gate -->
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">
      <rect x="390" y="146" width="540" height="280" rx="8" fill="#161b22" stroke="#2088ff" stroke-width="2"/>
      <text x="406" y="170" fill="#2088ff" font-size="13" font-weight="600">deploy-gate.yml</text>
      <text x="914" y="170" fill="#79c0ff" text-anchor="end">push: main · workflow_dispatch</text>
      <text x="406" y="190" fill="#f0f6fc">concurrency: deploy-gate · cancel-in-progress: false</text>
      <text x="406" y="208" fill="#8b949e">defaults.run.shell: bash → pipefail</text>

      <rect x="406" y="220" width="240" height="194" rx="6" fill="#0d1117" stroke="#30363d"/>
      <text x="418" y="240" fill="#f0f6fc" font-size="12" font-weight="600">staging</text>
      <text x="418" y="258" fill="#3fb950">environment: staging</text>
      <text x="418" y="276" fill="#e3b341">id-token: write</text>
      <text x="418" y="294" fill="#8b949e">contents: read</text>
      <text x="418" y="314" fill="#d2a8ff">postgres:17.11-alpine</text>
      <text x="418" y="330" fill="#d2a8ff">← DATABASE_PASSWORD</text>
      <text x="418" y="350" fill="#f0f6fc">tablero.migrate</text>
      <text x="418" y="370" fill="#79c0ff">curl | jq | oidc-verifier</text>
      <text x="418" y="388" fill="#8b949e">--sub vars.OIDC_SUB</text>
      <text x="418" y="404" fill="#8b949e">ref=main · github-hosted</text>

      <rect x="676" y="220" width="240" height="194" rx="6" fill="#0d1117" stroke="#e3b341"/>
      <text x="688" y="240" fill="#f0f6fc" font-size="12" font-weight="600">production</text>
      <text x="904" y="240" fill="#8b949e" text-anchor="end">needs: staging</text>
      <text x="688" y="258" fill="#3fb950">environment: production</text>
      <text x="688" y="276" fill="#e3b341">id-token: write</text>
      <text x="688" y="294" fill="#8b949e">contents: read</text>
      <text x="688" y="314" fill="#d2a8ff">postgres:17.11-alpine</text>
      <text x="688" y="330" fill="#d2a8ff">← DATABASE_PASSWORD</text>
      <text x="688" y="350" fill="#f0f6fc">tablero.migrate</text>
      <text x="688" y="370" fill="#79c0ff">curl | jq | oidc-verifier</text>
      <text x="688" y="388" fill="#e3b341">espera tu aprobación</text>
      <text x="688" y="404" fill="#8b949e">audience: tablero-verifier</text>
    </g>
    <path d="M646 317 L672 317" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#a13)"/>

    <!-- otros nuevos -->
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">
      <rect x="390" y="440" width="265" height="92" rx="8" fill="#161b22" stroke="#2088ff" stroke-width="2"/>
      <text x="406" y="464" fill="#2088ff" font-size="13" font-weight="600">ci-tools.yml</text>
      <text x="406" y="486" fill="#f0f6fc">→ _python.yml@v1.0.0</text>
      <text x="406" y="504" fill="#8b949e">tools/oidc-verifier</text>
      <text x="406" y="518" fill="#8b949e">integration: false</text>

      <rect x="665" y="440" width="265" height="92" rx="8" fill="#161b22" stroke="#2088ff" stroke-width="2"/>
      <text x="681" y="464" fill="#2088ff" font-size="13" font-weight="600">tools/oidc-verifier</text>
      <text x="681" y="486" fill="#f0f6fc">copiado de app/ · uv</text>
      <text x="681" y="504" fill="#8b949e">PyJWT · cryptography</text>
      <text x="681" y="518" fill="#8b949e">16 tests unitarios</text>

      <rect x="30" y="440" width="330" height="92" rx="8" fill="#161b22" stroke="#2088ff" stroke-width="2"/>
      <text x="46" y="464" fill="#2088ff" font-size="13" font-weight="600">dependabot.yml</text>
      <text x="46" y="486" fill="#f0f6fc">uv: /api · /tools/oidc-verifier</text>
      <text x="46" y="504" fill="#8b949e">github-actions · npm (pnpm)</text>
    </g>

    <!-- environments y repo -->
    <text x="30" y="568" fill="#d2a8ff" font-size="14" font-weight="600">Configuración de &lt;tu-org&gt;/tablero</text>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">
      <rect x="30" y="580" width="280" height="122" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
      <text x="46" y="604" fill="#3fb950" font-size="13" font-weight="600">environment staging</text>
      <text x="46" y="626" fill="#f0f6fc">ramas: main</text>
      <text x="46" y="646" fill="#d2a8ff">secret DATABASE_PASSWORD</text>
      <text x="46" y="666" fill="#d2a8ff">var OIDC_SUB</text>

      <rect x="340" y="580" width="280" height="122" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
      <text x="356" y="604" fill="#3fb950" font-size="13" font-weight="600">environment production</text>
      <text x="356" y="626" fill="#f0f6fc">ramas: main</text>
      <text x="356" y="646" fill="#d2a8ff">secret DATABASE_PASSWORD (otro)</text>
      <text x="356" y="666" fill="#d2a8ff">var OIDC_SUB (otro)</text>
      <text x="356" y="684" fill="#e3b341">revisor: tú</text>

      <rect x="650" y="580" width="280" height="122" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
      <text x="666" y="604" fill="#d2a8ff" font-size="13" font-weight="600">repo</text>
      <text x="666" y="626" fill="#f0f6fc">sub: include_claim_keys</text>
      <text x="682" y="644" fill="#f0f6fc">repo · context ·</text>
      <text x="682" y="662" fill="#f0f6fc">job_workflow_ref</text>
      <text x="666" y="682" fill="#f85149">sin DATABASE_PASSWORD de repo</text>
    </g>

    <!-- después -->
    <g font-size="12" fill="#8b949e">
      <rect x="30" y="728" width="280" height="44" rx="8" fill="#0d1117" stroke="#30363d" stroke-dasharray="6 4"/>
      <text x="46" y="755"><tspan font-weight="600">Semana 14</tspan> · releases y attestations</text>
      <rect x="340" y="728" width="280" height="44" rx="8" fill="#0d1117" stroke="#30363d" stroke-dasharray="6 4"/>
      <text x="356" y="755"><tspan font-weight="600">Semana 15</tspan> · runners propios</text>
      <rect x="650" y="728" width="280" height="44" rx="8" fill="#0d1117" stroke="#30363d" stroke-dasharray="6 4"/>
      <text x="666" y="755"><tspan font-weight="600">Semana 17</tspan> · despliegue real a k8s</text>
    </g>
    <text x="480" y="814" fill="#8b949e" font-size="11" text-anchor="middle">Azul: workflows y piezas nuevas. Verde: environments y sus reglas. Morado: secretos, variables y la plantilla del sub.</text>
    <text x="480" y="832" fill="#8b949e" font-size="11" text-anchor="middle">Amarillo: permisos de escritura, id-token incluido, y la aprobación. Rojo: lo que no debe existir.</text>
    <text x="480" y="850" fill="#8b949e" font-size="11" text-anchor="middle">Gris discontinuo: lo que añaden las siguientes semanas.</text>
  </g>
</svg>
