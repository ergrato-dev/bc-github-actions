    <text x="480" y="832" fill="#8b949e" font-size="11" text-anchor="middle">Azul: llamadas. Verde: outputs de vuelta. Morado: secretos. Amarillo: filtros, permisos y la puerta. Gris discontinuo: lo que añaden las siguientes.</text>
  </g>
</svg>
