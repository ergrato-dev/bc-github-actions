    <!-- llamadas -->
    <path d="M344 256 L456 256" stroke="#2088ff" stroke-width="2" fill="none" marker-end="url(#a09)"/>
    <path d="M344 394 L456 394" stroke="#2088ff" stroke-width="2" fill="none" marker-end="url(#a09)"/>
    <path d="M344 574 L456 574" stroke="#2088ff" stroke-width="2" fill="none" marker-end="url(#a09)"/>
    <path d="M344 624 L456 574" stroke="#2088ff" stroke-width="2" fill="none" marker-end="url(#a09)"/>
    <text x="400" y="248" fill="#2088ff" font-size="11" text-anchor="middle">uses: ./</text>
    <!-- outputs de vuelta -->
    <path d="M472 446 L348 444" stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#a09g)"/>
    <path d="M472 660 L348 669" stroke="#3fb950" stroke-width="2" fill="none" marker-end="url(#a09g)"/>

    <!-- puerta -->
    <rect x="30" y="716" width="900" height="44" rx="8" fill="#0d1117" stroke="#e3b341"/>
    <text x="46" y="743" fill="#e3b341" font-size="12" font-weight="600">lint-workflows.yml</text>
    <text x="186" y="743" fill="#f0f6fc" font-size="12">actionlint lee los ./ y valida inputs y secretos de cada llamada · zizmor bloquea secrets: inherit</text>

    <!-- lo que llega después -->
    <g font-size="12" fill="#8b949e">
