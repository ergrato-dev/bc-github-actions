<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 840" xml:space="preserve" role="img" aria-labelledby="t09">
  <title id="t09">Mapa del pipeline de tablero en la capa 09. Arriba, sin cambios desde la capa 08: ci.yml, smoke.yml, nightly.yml y lint-workflows.yml. En el centro, a la izquierda, los tres llamadores, que ahora solo deciden cuándo corren y con qué inputs: ci-api.yml, con paths api y _python.yml, concurrency y un único job api que llama a _python.yml; ci-web.yml, con paths web y _node.yml, el job web que llama a _node.yml y el job dist-report, que descarga el artefacto cuyo nombre devuelve el reutilizable; images.yml, con paths api, web e _image.yml, los jobs api y web que llaman a _image.yml concediendo packages write y pasando registry-password de forma explícita, y el job summary, que recibe los dos digests por env. A la derecha, los tres reutilizables, que solo se disparan con workflow_call: _python.yml con los inputs working-directory, package, coverage-min e integration y los jobs lint, test e integration, este último solo si integration es true; _node.yml con working-directory, node-versions como lista JSON y artifact-name, los jobs lint, test en matriz con fromJSON y build, y el output artifact-name; _image.yml con image y push, el secreto obligatorio registry-password, el job build y el output digest. Cada job de los reutilizables lleva su timeout-minutes. Debajo, lint-workflows.yml valida las llamadas: actionlint lee los reutilizables locales y comprueba inputs y secretos, y zizmor bloquea secrets inherit. En gris, lo que llega después: actions composite en la Semana 10, el repo central actions-tablero con referencias por SHA en la 11 y permisos a fondo en la 12</title>
  <rect width="960" height="840" fill="#0d1117"/>
  <defs>
    <marker id="a09" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2088ff"/></marker>
    <marker id="a09g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker>
  </defs>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="480" y="36" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">tablero · capa 09</text>

    <!-- sin cambios -->
    <rect x="30" y="58" width="900" height="56" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="46" y="80" fill="#8b949e" font-size="12" font-weight="600">capas 01-08, sin cambios</text>
    <g font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#f0f6fc">
      <text x="46" y="102">ci.yml</text><text x="196" y="102">smoke.yml</text><text x="366" y="102">nightly.yml</text><text x="546" y="102">lint-workflows.yml</text>
    </g>

    <!-- columnas -->
    <text x="30" y="144" fill="#f0f6fc" font-size="14" font-weight="600">Llamadores: cuándo y con qué</text>
    <text x="930" y="144" fill="#2088ff" font-size="14" font-weight="600" text-anchor="end">Reutilizables: on: workflow_call · nuevos en esta capa</text>

    <!-- ci-api -->
    <rect x="30" y="156" width="330" height="140" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="46" y="180" fill="#f0f6fc" font-size="14" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">ci-api.yml</text>
    <g font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="46" y="202" fill="#e3b341">paths: api/** · ci-api.yml · _python.yml</text>
      <text x="46" y="220" fill="#8b949e">concurrency · contents: read</text>
      <rect x="46" y="232" width="298" height="48" rx="5" fill="#0d1117" stroke="#2088ff"/>
      <text x="58" y="252" fill="#f0f6fc">api · name: API</text>
      <text x="58" y="270" fill="#79c0ff">with: api · tablero · coverage 60</text>
    </g>

    <!-- ci-web -->
    <rect x="30" y="316" width="330" height="160" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="46" y="340" fill="#f0f6fc" font-size="14" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">ci-web.yml</text>
    <g font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="46" y="362" fill="#e3b341">paths: web/** · ci-web.yml · _node.yml</text>
      <rect x="46" y="372" width="298" height="44" rx="5" fill="#0d1117" stroke="#2088ff"/>
      <text x="58" y="390" fill="#f0f6fc">web · name: Web</text>
      <text x="58" y="406" fill="#79c0ff">node-versions: "[24, 26]"</text>
      <rect x="46" y="424" width="298" height="40" rx="5" fill="#0d1117" stroke="#3fb950"/>
      <text x="58" y="441" fill="#f0f6fc">dist-report · needs: web</text>
      <text x="58" y="456" fill="#3fb950">needs.web.outputs.artifact-name</text>
