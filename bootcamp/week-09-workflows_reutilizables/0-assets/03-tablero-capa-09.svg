    <!-- images -->
    <rect x="30" y="496" width="330" height="200" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="46" y="520" fill="#f0f6fc" font-size="14" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">images.yml</text>
    <g font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="46" y="542" fill="#e3b341">paths: api/** · web/** · _image.yml</text>
      <rect x="46" y="552" width="298" height="44" rx="5" fill="#0d1117" stroke="#2088ff"/>
      <text x="58" y="570" fill="#f0f6fc">api · packages: write</text>
      <text x="58" y="586" fill="#d2a8ff">registry-password: GITHUB_TOKEN</text>
      <rect x="46" y="602" width="298" height="44" rx="5" fill="#0d1117" stroke="#2088ff"/>
      <text x="58" y="620" fill="#f0f6fc">web · packages: write</text>
      <text x="58" y="636" fill="#d2a8ff">registry-password: GITHUB_TOKEN</text>
      <rect x="46" y="652" width="298" height="34" rx="5" fill="#0d1117" stroke="#3fb950"/>
      <text x="58" y="673" fill="#3fb950">summary · env: los dos digests</text>
    </g>

    <!-- _python -->
    <rect x="460" y="156" width="470" height="140" rx="8" fill="#161b22" stroke="#2088ff" stroke-width="2"/>
    <text x="476" y="180" fill="#2088ff" font-size="14" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">_python.yml</text>
    <g font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="476" y="202" fill="#79c0ff">working-directory · package (string)</text>
      <text x="476" y="218" fill="#79c0ff">coverage-min (number) · integration (boolean)</text>
      <rect x="476" y="232" width="120" height="48" rx="5" fill="#0d1117" stroke="#30363d"/>
      <text x="488" y="252" fill="#f0f6fc">lint</text><text x="488" y="270" fill="#8b949e">10 min</text>
      <rect x="606" y="232" width="120" height="48" rx="5" fill="#0d1117" stroke="#30363d"/>
      <text x="618" y="252" fill="#f0f6fc">test</text><text x="618" y="270" fill="#8b949e">10 min</text>
      <rect x="736" y="232" width="178" height="48" rx="5" fill="#0d1117" stroke="#e3b341"/>
      <text x="748" y="252" fill="#f0f6fc">integration</text><text x="748" y="270" fill="#e3b341">if: inputs.integration</text>
    </g>

    <!-- _node -->
    <rect x="460" y="316" width="470" height="160" rx="8" fill="#161b22" stroke="#2088ff" stroke-width="2"/>
    <text x="476" y="340" fill="#2088ff" font-size="14" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">_node.yml</text>
    <g font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="476" y="362" fill="#79c0ff">working-directory · node-versions (JSON) · artifact-name</text>
      <rect x="476" y="372" width="134" height="48" rx="5" fill="#0d1117" stroke="#30363d"/>
      <text x="488" y="392" fill="#f0f6fc">lint</text><text x="488" y="410" fill="#8b949e">10 min</text>
      <rect x="620" y="372" width="150" height="48" rx="5" fill="#0d1117" stroke="#30363d"/>
      <text x="632" y="392" fill="#f0f6fc">test · Node 24, 26</text><text x="632" y="410" fill="#8b949e">fromJSON(...)</text>
      <rect x="780" y="372" width="134" height="48" rx="5" fill="#0d1117" stroke="#30363d"/>
      <text x="792" y="392" fill="#f0f6fc">build</text><text x="792" y="410" fill="#8b949e">artefacto</text>
      <text x="476" y="450" fill="#3fb950">output: artifact-name</text>
      <text x="476" y="466" fill="#8b949e">← jobs.build.outputs.artifact-name</text>
    </g>

    <!-- _image -->
    <rect x="460" y="496" width="470" height="200" rx="8" fill="#161b22" stroke="#2088ff" stroke-width="2"/>
    <text x="476" y="520" fill="#2088ff" font-size="14" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">_image.yml</text>
    <text x="914" y="520" fill="#8b949e" font-size="11" text-anchor="end">llamado dos veces</text>
    <g font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace">
