<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="t02">
  <title id="t02">Cálculo de los permisos efectivos del GITHUB_TOKEN de un job, en cinco pasos de arriba abajo. Paso 1: default de la empresa, la org o el repo; en la org del alumno, read. Paso 2: permissions en la raíz del workflow, que sustituye al default; en tablero, llaves vacías. Paso 3: permissions en el job, que sustituye a la raíz entera; por ejemplo contents read y pull-requests write; los scopes no declarados quedan en none. Paso 4: si el job llama a un reutilizable, sus permisos son el techo de los jobs de dentro, que pueden pedir menos y nunca más. Paso 5: en un PR desde un fork, salvo pull_request_target, y sin la opción Send write tokens to workflows from pull requests, todo write pasa a read. Abajo, el resultado que se lee en el log del paso Set up job, en el grupo GITHUB_TOKEN Permissions: Contents read y Metadata read, con pull-requests en read para un PR de fork: el labeler no puede etiquetar.</title>
  <rect width="960" height="620" fill="#0d1117"/>
  <defs>
    <marker id="a02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2088ff"/></marker>
  </defs>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="480" y="36" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">Cálculo de los permisos efectivos de un job</text>
    <text x="250" y="70" fill="#8b949e" font-size="12" font-weight="600" text-anchor="middle">Paso</text>
    <text x="730" y="70" fill="#8b949e" font-size="12" font-weight="600" text-anchor="middle">Ejemplo: job label con pull_request desde un fork</text>

    <g font-size="13">
      <rect x="30" y="82" width="440" height="70" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
      <text x="46" y="108" fill="#f0f6fc" font-weight="600">1 · Default de empresa, org o repo</text>
      <text x="46" y="132" fill="#8b949e" font-size="11">solo aplica si el workflow no declara nada</text>
      <rect x="510" y="82" width="420" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="526" y="122" fill="#d2a8ff" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">org: read (Semana 11)</text>

      <rect x="30" y="170" width="440" height="70" rx="8" fill="#161b22" stroke="#2088ff" stroke-width="2"/>
      <text x="46" y="196" fill="#f0f6fc" font-weight="600">2 · permissions: en la raíz</text>
      <text x="46" y="220" fill="#8b949e" font-size="11">sustituye al default para todos los jobs</text>
      <rect x="510" y="170" width="420" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="526" y="210" fill="#79c0ff" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">permissions: {}   → todo none</text>

      <rect x="30" y="258" width="440" height="70" rx="8" fill="#161b22" stroke="#2088ff" stroke-width="2"/>
      <text x="46" y="284" fill="#f0f6fc" font-weight="600">3 · permissions: en el job</text>
      <text x="46" y="308" fill="#8b949e" font-size="11">sustituye a la raíz entera; lo no declarado, none</text>
      <rect x="510" y="258" width="420" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="526" y="288" fill="#79c0ff" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">contents: read</text>
      <text x="526" y="308" fill="#79c0ff" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">pull-requests: write</text>

      <rect x="30" y="346" width="440" height="70" rx="8" fill="#161b22" stroke="#2088ff" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="46" y="372" fill="#f0f6fc" font-weight="600">4 · Techo del reutilizable</text>
      <text x="46" y="396" fill="#8b949e" font-size="11">si el job hace uses: de un workflow; dentro, menos o igual</text>
      <rect x="510" y="346" width="420" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="526" y="386" fill="#8b949e" font-size="12">no aplica: label no llama a un reutilizable</text>

      <rect x="30" y="434" width="440" height="70" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
      <text x="46" y="460" fill="#f0f6fc" font-weight="600">5 · Recorte por fork</text>
      <text x="46" y="484" fill="#8b949e" font-size="11">PR de fork, salvo pull_request_target: write → read</text>
      <rect x="510" y="434" width="420" height="70" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="526" y="464" fill="#79c0ff" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">contents: read</text>
      <text x="526" y="484" fill="#e3b341" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">pull-requests: write → read</text>
    </g>

    <g stroke="#2088ff" stroke-width="2" fill="none" marker-end="url(#a02)">
      <path d="M250 152 L250 166"/>
      <path d="M250 240 L250 254"/>
      <path d="M250 328 L250 342"/>
      <path d="M250 416 L250 430"/>
      <path d="M250 504 L250 528"/>
    </g>

    <rect x="30" y="532" width="900" height="56" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="46" y="556" fill="#3fb950" font-size="13" font-weight="600">Set up job → GITHUB_TOKEN Permissions</text>
    <text x="46" y="576" fill="#f0f6fc" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">Contents: read · Metadata: read · pull-requests en read   ← el labeler no puede etiquetar</text>

    <text x="480" y="608" fill="#8b949e" font-size="11" text-anchor="middle">Cada paso sustituye al anterior; ninguno suma. Lo que no sale en el log está en none.</text>
  </g>
</svg>
