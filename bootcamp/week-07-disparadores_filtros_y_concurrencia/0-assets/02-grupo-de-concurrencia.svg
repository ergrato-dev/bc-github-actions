<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t02">
  <title id="t02">Un grupo de concurrencia admite como mucho un run en curso y uno pendiente. Tres pushes seguidos al mismo pull request calculan el mismo grupo, ci-api-refs/pull/7/merge. Con cancel-in-progress false, el run A sigue en curso, el run B espera como pendiente y, cuando llega C, C cancela a B y ocupa su sitio: B nunca empieza y C corre cuando A termina. Con cancel-in-progress true, cada run nuevo cancela al que está en curso y corre en el acto, así que solo el último push llega al final. La expresión cancel-in-progress igual a github.event_name == 'pull_request' aplica la segunda fila en los PR y la primera en main</title>
  <rect width="960" height="600" fill="#0d1117"/>
  <defs>
    <marker id="a02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#79c0ff"/></marker>
    <marker id="a02r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker>
  </defs>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="480" y="36" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">Un grupo: uno en curso, uno pendiente</text>
    <text x="480" y="58" fill="#8b949e" font-size="13" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">group: ${{ github.workflow }}-${{ github.ref }}  →  ci-api-refs/pull/7/merge</text>

    <!-- pushes -->
    <g font-size="13">
      <text x="40" y="100" fill="#8b949e">Tres pushes seguidos al PR #7</text>
      <rect x="40" y="112" width="120" height="34" rx="6" fill="#161b22" stroke="#79c0ff"/>
      <text x="100" y="134" fill="#f0f6fc" text-anchor="middle">push 1 → A</text>
      <rect x="180" y="112" width="120" height="34" rx="6" fill="#161b22" stroke="#79c0ff"/>
      <text x="240" y="134" fill="#f0f6fc" text-anchor="middle">push 2 → B</text>
      <rect x="320" y="112" width="120" height="34" rx="6" fill="#161b22" stroke="#79c0ff"/>
      <text x="380" y="134" fill="#f0f6fc" text-anchor="middle">push 3 → C</text>
      <path d="M460 129 L540 129" stroke="#79c0ff" stroke-width="2" marker-end="url(#a02)"/>
      <text x="560" y="134" fill="#8b949e">el tiempo avanza hacia la derecha</text>
    </g>

    <!-- fila false -->
    <rect x="30" y="170" width="900" height="180" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="50" y="196" fill="#f0f6fc" font-size="15" font-weight="600">cancel-in-progress: false</text>
    <text x="50" y="216" fill="#8b949e" font-size="12">lo que pasa en main</text>

    <text x="50" y="250" fill="#8b949e" font-size="12">en curso</text>
    <text x="50" y="304" fill="#8b949e" font-size="12">pendiente</text>

    <rect x="140" y="232" width="420" height="30" rx="5" fill="#0d1117" stroke="#2088ff" stroke-width="2"/>
    <text x="350" y="252" fill="#f0f6fc" font-size="12" text-anchor="middle">A corre hasta el final</text>
    <rect x="570" y="232" width="340" height="30" rx="5" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <text x="740" y="252" fill="#3fb950" font-size="12" text-anchor="middle">C corre cuando A termina</text>

    <rect x="240" y="286" width="150" height="30" rx="5" fill="#0d1117" stroke="#e3b341"/>
    <text x="315" y="306" fill="#e3b341" font-size="12" text-anchor="middle">B espera</text>
    <rect x="400" y="286" width="160" height="30" rx="5" fill="#0d1117" stroke="#e3b341"/>
    <text x="480" y="306" fill="#e3b341" font-size="12" text-anchor="middle">C espera</text>
    <text x="315" y="336" fill="#f85149" font-size="12" text-anchor="middle">B cancelado: C ocupa su sitio</text>
    <path d="M560 300 C 566 290, 566 270, 570 262" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#a02)"/>

    <!-- fila true -->
    <rect x="30" y="370" width="900" height="150" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="50" y="396" fill="#f0f6fc" font-size="15" font-weight="600">cancel-in-progress: true</text>
    <text x="50" y="416" fill="#8b949e" font-size="12">lo que pasa en un PR</text>

    <text x="50" y="456" fill="#8b949e" font-size="12">en curso</text>
    <rect x="140" y="438" width="100" height="30" rx="5" fill="#0d1117" stroke="#f85149"/>
    <text x="190" y="458" fill="#f85149" font-size="12" text-anchor="middle">A cancelado</text>
    <rect x="250" y="438" width="140" height="30" rx="5" fill="#0d1117" stroke="#f85149"/>
    <text x="320" y="458" fill="#f85149" font-size="12" text-anchor="middle">B cancelado</text>
    <rect x="400" y="438" width="510" height="30" rx="5" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <text x="655" y="458" fill="#3fb950" font-size="12" text-anchor="middle">C corre en el acto: solo el último push llega al final</text>
    <text x="140" y="498" fill="#8b949e" font-size="12">cada run nuevo corta al que está en curso; nunca hay pendiente</text>

    <!-- pie -->
    <rect x="30" y="538" width="900" height="44" rx="8" fill="#161b22" stroke="#d2a8ff"/>
    <text x="480" y="566" fill="#d2a8ff" font-size="13" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">cancel-in-progress: ${{ github.event_name == 'pull_request' }}  →  fila de abajo en PR, fila de arriba en main</text>
  </g>
</svg>
