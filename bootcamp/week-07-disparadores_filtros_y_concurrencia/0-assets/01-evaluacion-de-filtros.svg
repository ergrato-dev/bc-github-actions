<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="t01">
  <title id="t01">Cómo decide GitHub si un push o un pull request dispara un workflow. Primero comprueba el filtro de ramas o tags: si no casa, no se crea ningún run y no queda rastro. Si casa y es un push de tag, el workflow corre sin evaluar paths. Si es una rama, GitHub calcula un diff: en un push, de dos puntos entre el commit anterior y el nuevo; en un pull request, de tres puntos entre la base de fusión y la punta del PR. Si algún archivo del diff casa con paths, el workflow corre; si ninguno casa, no hay run. Límites: un push de más de 1.000 commits corre siempre, un diff de más de 3.000 archivos puede no correr y un diff que da timeout corre siempre</title>
  <rect width="960" height="640" fill="#0d1117"/>
  <defs>
    <marker id="a01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#79c0ff"/></marker>
    <marker id="a01g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker>
    <marker id="a01r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker>
  </defs>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="480" y="36" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">¿Este push o este PR dispara el workflow?</text>
    <text x="480" y="58" fill="#8b949e" font-size="13" text-anchor="middle">GitHub evalúa los filtros en este orden antes de crear el run</text>

    <!-- evento -->
    <rect x="360" y="80" width="240" height="50" rx="8" fill="#161b22" stroke="#79c0ff" stroke-width="2"/>
    <text x="480" y="102" fill="#f0f6fc" font-size="14" font-weight="600" text-anchor="middle">Evento push o pull_request</text>
    <text x="480" y="120" fill="#8b949e" font-size="11" text-anchor="middle">en PR, la rama que cuenta es la base</text>
    <path d="M480 130 L480 156" stroke="#79c0ff" stroke-width="2" marker-end="url(#a01)"/>

    <!-- paso 1 -->
    <rect x="340" y="160" width="280" height="56" rx="8" fill="#161b22" stroke="#2088ff" stroke-width="2"/>
    <text x="480" y="184" fill="#f0f6fc" font-size="14" font-weight="600" text-anchor="middle">1. ¿Casa branches / tags?</text>
    <text x="480" y="203" fill="#8b949e" font-size="11" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">el último patrón que casa gana</text>

    <path d="M620 188 L736 188" stroke="#f85149" stroke-width="2" marker-end="url(#a01r)"/>
    <text x="678" y="180" fill="#f85149" font-size="12" text-anchor="middle">no</text>
    <rect x="740" y="160" width="190" height="56" rx="8" fill="#161b22" stroke="#f85149"/>
    <text x="835" y="184" fill="#f85149" font-size="14" font-weight="600" text-anchor="middle">Sin run</text>
    <text x="835" y="203" fill="#8b949e" font-size="11" text-anchor="middle">no queda ningún rastro</text>

    <path d="M480 216 L480 252" stroke="#79c0ff" stroke-width="2" marker-end="url(#a01)"/>
    <text x="494" y="240" fill="#79c0ff" font-size="12">sí</text>

    <!-- paso 2 -->
    <rect x="340" y="256" width="280" height="50" rx="8" fill="#161b22" stroke="#2088ff" stroke-width="2"/>
    <text x="480" y="286" fill="#f0f6fc" font-size="14" font-weight="600" text-anchor="middle">2. ¿Es un push de tag?</text>

    <path d="M340 281 L226 281" stroke="#3fb950" stroke-width="2" marker-end="url(#a01g)"/>
    <text x="283" y="273" fill="#3fb950" font-size="12" text-anchor="middle">sí</text>
    <rect x="30" y="253" width="192" height="56" rx="8" fill="#161b22" stroke="#3fb950"/>
    <text x="126" y="277" fill="#3fb950" font-size="14" font-weight="600" text-anchor="middle">Corre</text>
    <text x="126" y="296" fill="#8b949e" font-size="11" text-anchor="middle">paths no se evalúan</text>

    <path d="M480 306 L480 342" stroke="#79c0ff" stroke-width="2" marker-end="url(#a01)"/>
    <text x="494" y="330" fill="#79c0ff" font-size="12">no, es una rama</text>

    <!-- paso 3: diff -->
    <rect x="160" y="346" width="640" height="120" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="480" y="370" fill="#f0f6fc" font-size="14" font-weight="600" text-anchor="middle">3. Calcular qué archivos cambian</text>
    <rect x="184" y="384" width="282" height="66" rx="6" fill="#0d1117" stroke="#79c0ff"/>
    <text x="325" y="406" fill="#79c0ff" font-size="13" font-weight="600" text-anchor="middle">push: diff de dos puntos</text>
    <text x="325" y="425" fill="#f0f6fc" font-size="12" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">before..after</text>
    <text x="325" y="442" fill="#8b949e" font-size="11" text-anchor="middle">solo lo que trae este push</text>
    <rect x="494" y="384" width="282" height="66" rx="6" fill="#0d1117" stroke="#79c0ff"/>
    <text x="635" y="406" fill="#79c0ff" font-size="13" font-weight="600" text-anchor="middle">pull_request: tres puntos</text>
    <text x="635" y="425" fill="#f0f6fc" font-size="12" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">base...head</text>
    <text x="635" y="442" fill="#8b949e" font-size="11" text-anchor="middle">todo lo que cambia el PR</text>

    <path d="M480 466 L480 494" stroke="#79c0ff" stroke-width="2" marker-end="url(#a01)"/>

    <!-- paso 4 -->
    <rect x="340" y="498" width="280" height="50" rx="8" fill="#161b22" stroke="#2088ff" stroke-width="2"/>
    <text x="480" y="528" fill="#f0f6fc" font-size="14" font-weight="600" text-anchor="middle">4. ¿Algún archivo casa con paths?</text>

    <path d="M340 523 L226 523" stroke="#3fb950" stroke-width="2" marker-end="url(#a01g)"/>
    <text x="283" y="515" fill="#3fb950" font-size="12" text-anchor="middle">sí</text>
    <rect x="30" y="498" width="192" height="50" rx="8" fill="#161b22" stroke="#3fb950"/>
    <text x="126" y="528" fill="#3fb950" font-size="14" font-weight="600" text-anchor="middle">Corre</text>

    <path d="M620 523 L736 523" stroke="#f85149" stroke-width="2" marker-end="url(#a01r)"/>
    <text x="678" y="515" fill="#f85149" font-size="12" text-anchor="middle">no</text>
    <rect x="740" y="498" width="190" height="50" rx="8" fill="#161b22" stroke="#f85149"/>
    <text x="835" y="519" fill="#f85149" font-size="14" font-weight="600" text-anchor="middle">Sin run</text>
    <text x="835" y="537" fill="#8b949e" font-size="11" text-anchor="middle">check obligatorio: "Expected"</text>

    <!-- limites -->
    <rect x="30" y="568" width="900" height="54" rx="8" fill="#161b22" stroke="#e3b341"/>
    <text x="50" y="590" fill="#e3b341" font-size="13" font-weight="600">Límites del paso 3</text>
    <text x="50" y="610" fill="#8b949e" font-size="12">más de 1.000 commits en un push: corre siempre · diff de más de 3.000 archivos: puede no correr · diff con timeout: corre siempre</text>
  </g>
</svg>
