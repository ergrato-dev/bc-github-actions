<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" role="img" aria-labelledby="t4">
  <title id="t4">Los cuatro modos de contenedor de ARC. Sin modo, el que usa tablero: el pod tiene solo el contenedor runner, sin Docker y sin permisos sobre la API de Kubernetes. Modo dind: el pod añade un init container que copia externals y un contenedor dind con la imagen docker:dind, privilegiado y con dockerd como root; el runner le habla por el socket, y un job puede alcanzar el nodo, que en kind es un contenedor privilegiado de tu máquina. Modo kubernetes: el runner usa los runner container hooks para pedir a la API un pod nuevo por cada contenedor del job; necesita un volumen persistente y una service account que crea y borra pods, hace exec y crea secrets, y obliga a declarar container en el job. Modo kubernetes-novolume: lo mismo sin volumen persistente, con la misma service account.</title>
  <rect width="1040" height="600" fill="#0d1117"/>
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#79c0ff"/></marker>
    <marker id="r4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker>
  </defs>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="520" y="36" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">Modos de contenedor de ARC</text>

    <!-- cabeceras -->
    <g font-size="14" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="145" y="76" fill="#3fb950" text-anchor="middle">sin containerMode</text>
      <text x="395" y="76" fill="#f85149" text-anchor="middle">dind</text>
      <text x="645" y="76" fill="#e3b341" text-anchor="middle">kubernetes</text>
      <text x="895" y="76" fill="#e3b341" text-anchor="middle">kubernetes-novolume</text>
    </g>

    <!-- 1 sin modo -->
    <rect x="30" y="92" width="230" height="300" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="44" y="114" fill="#8b949e" font-size="11">pod del runner</text>
    <rect x="46" y="128" width="198" height="70" rx="6" fill="#0d1117" stroke="#2088ff"/>
    <text x="58" y="152" fill="#f0f6fc" font-size="12" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">runner</text>
    <text x="58" y="172" fill="#8b949e" font-size="11">uv, pytest, actions JS</text>
    <text x="58" y="188" fill="#8b949e" font-size="11">y composite</text>
    <text x="46" y="236" fill="#f0f6fc" font-size="12">Nada más en el pod.</text>
    <text x="46" y="258" fill="#8b949e" font-size="11">Sin services:, container:</text>
    <text x="46" y="274" fill="#8b949e" font-size="11">ni docker build.</text>
    <rect x="46" y="340" width="120" height="30" rx="15" fill="#0d1117" stroke="#3fb950"/>
    <text x="106" y="360" fill="#3fb950" font-size="12" font-weight="600" text-anchor="middle">tablero</text>

    <!-- 2 dind -->
    <rect x="280" y="92" width="230" height="300" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="294" y="114" fill="#8b949e" font-size="11">pod del runner</text>
    <rect x="296" y="124" width="198" height="40" rx="6" fill="#0d1117" stroke="#30363d" stroke-dasharray="4 3"/>
    <text x="308" y="142" fill="#8b949e" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace">init-dind-externals</text>
    <text x="308" y="156" fill="#8b949e" font-size="10">copia externals/</text>
    <rect x="296" y="174" width="198" height="72" rx="6" fill="#0d1117" stroke="#f85149" stroke-width="2"/>
    <text x="308" y="194" fill="#f0f6fc" font-size="12" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">dind</text>
    <text x="308" y="212" fill="#8b949e" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace">docker:dind · dockerd</text>
    <text x="308" y="232" fill="#f85149" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace">privileged: true</text>
    <rect x="296" y="276" width="198" height="54" rx="6" fill="#0d1117" stroke="#2088ff"/>
    <text x="308" y="298" fill="#f0f6fc" font-size="12" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">runner</text>
    <text x="308" y="316" fill="#8b949e" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace">DOCKER_HOST=unix://…sock</text>
    <path d="M395 276 L395 248" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#a4)"/>
    <text x="403" y="266" fill="#79c0ff" font-size="10">socket</text>
    <path d="M395 340 L395 382" stroke="#f85149" stroke-width="2" stroke-dasharray="5 3" fill="none" marker-end="url(#r4)"/>
    <text x="403" y="364" fill="#f85149" font-size="10">un job llega al nodo</text>

    <!-- 3 kubernetes -->
    <rect x="530" y="92" width="230" height="300" rx="10" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <text x="544" y="114" fill="#8b949e" font-size="11">namespace arc-runners: dos pods</text>
    <rect x="546" y="124" width="198" height="72" rx="6" fill="#0d1117" stroke="#2088ff"/>
    <text x="558" y="146" fill="#f0f6fc" font-size="12" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">runner</text>
    <text x="558" y="164" fill="#8b949e" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace">hooks: k8s/index.js</text>
    <text x="558" y="182" fill="#8b949e" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace">REQUIRE_JOB_CONTAINER</text>
    <rect x="546" y="206" width="198" height="40" rx="6" fill="#0d1117" stroke="#d2a8ff"/>
    <text x="558" y="224" fill="#d2a8ff" font-size="11">service account: crea pods,</text>
    <text x="558" y="239" fill="#d2a8ff" font-size="11">exec, jobs y secrets</text>
    <rect x="546" y="256" width="198" height="30" rx="6" fill="#0d1117" stroke="#e3b341"/>
    <text x="558" y="276" fill="#e3b341" font-size="11">volumen persistente /_work</text>
    <path d="M645 286 L645 318" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#a4)"/>
    <text x="653" y="306" fill="#79c0ff" font-size="10">API de Kubernetes</text>
    <rect x="546" y="320" width="198" height="56" rx="6" fill="#0d1117" stroke="#30363d" stroke-dasharray="4 3"/>
    <text x="558" y="342" fill="#f0f6fc" font-size="12" font-weight="600">pod del job</text>
    <text x="558" y="360" fill="#8b949e" font-size="10">container:, services, Docker</text>

    <!-- 4 kubernetes-novolume -->
    <rect x="780" y="92" width="230" height="300" rx="10" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
    <text x="794" y="114" fill="#8b949e" font-size="11">namespace arc-runners: dos pods</text>
    <rect x="796" y="124" width="198" height="72" rx="6" fill="#0d1117" stroke="#2088ff"/>
    <text x="808" y="146" fill="#f0f6fc" font-size="12" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">runner</text>
    <text x="808" y="164" fill="#8b949e" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace">hooks: k8s-novolume/</text>
    <text x="808" y="182" fill="#8b949e" font-size="10" font-family="ui-monospace, Menlo, Consolas, monospace">REQUIRE_JOB_CONTAINER</text>
    <rect x="796" y="206" width="198" height="40" rx="6" fill="#0d1117" stroke="#d2a8ff"/>
    <text x="808" y="224" fill="#d2a8ff" font-size="11">la misma service account</text>
    <text x="808" y="239" fill="#d2a8ff" font-size="11">que el modo kubernetes</text>
    <rect x="796" y="256" width="198" height="30" rx="6" fill="#0d1117" stroke="#30363d" stroke-dasharray="4 3"/>
    <text x="808" y="276" fill="#8b949e" font-size="11">sin volumen persistente</text>
    <path d="M895 286 L895 318" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#a4)"/>
    <text x="903" y="306" fill="#79c0ff" font-size="10">API de Kubernetes</text>
    <rect x="796" y="320" width="198" height="56" rx="6" fill="#0d1117" stroke="#30363d" stroke-dasharray="4 3"/>
    <text x="808" y="342" fill="#f0f6fc" font-size="12" font-weight="600">pod del job</text>
    <text x="808" y="360" fill="#8b949e" font-size="10">para clústeres sin almacenamiento</text>

    <!-- qué exige -->
    <text x="30" y="430" fill="#f0f6fc" font-size="14" font-weight="600">Qué exige cada modo</text>
    <g font-size="12">
      <rect x="30" y="444" width="230" height="74" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="44" y="468" fill="#3fb950" font-weight="600">Nada</text>
      <text x="44" y="488" fill="#8b949e">sin privilegios</text>
      <text x="44" y="506" fill="#8b949e">sin permisos en la API</text>

      <rect x="280" y="444" width="230" height="74" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="294" y="468" fill="#f85149" font-weight="600">Contenedor privilegiado</text>
      <text x="294" y="488" fill="#8b949e">dockerd como root</text>
      <text x="294" y="506" fill="#8b949e">en kind: hasta tu máquina</text>

      <rect x="530" y="444" width="230" height="74" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="544" y="468" fill="#e3b341" font-weight="600">Permisos sobre la API</text>
      <text x="544" y="488" fill="#8b949e">pods y secrets del namespace</text>
      <text x="544" y="506" fill="#8b949e">y un volumen por runner</text>

      <rect x="780" y="444" width="230" height="74" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="794" y="468" fill="#e3b341" font-weight="600">Permisos sobre la API</text>
      <text x="794" y="488" fill="#8b949e">pods y secrets del namespace</text>
      <text x="794" y="506" fill="#8b949e">sin volumen</text>
    </g>
    <text x="520" y="560" fill="#8b949e" font-size="11" text-anchor="middle">Plantillas tomadas del values.yaml del chart gha-runner-scale-set 0.15.1. Con dind, el chart inyecta la plantilla y no se puede sobrescribir.</text>
    <text x="520" y="580" fill="#8b949e" font-size="11" text-anchor="middle">Verde: lo que usa tablero. Rojo: privilegiado. Amarillo: permisos sobre la API de Kubernetes. Discontinuo: lo que crea el modo, no tú.</text>
  </g>
</svg>
