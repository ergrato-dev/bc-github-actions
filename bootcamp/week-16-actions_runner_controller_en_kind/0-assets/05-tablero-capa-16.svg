<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 950" role="img" aria-labelledby="t16">
  <title id="t16">Mapa del pipeline de tablero en la capa 16. Arriba, la regla que siguen todos los workflows desde la capa 12: permissions vacío en la raíz, permisos por job y ninguna expresión dentro de run. A la izquierda, lo que ya existía y sigue igual, todo en runners de GitHub con ubuntu-24.04: ci-api, ci y ci-web; images; nightly, smoke y lint-workflows; labeler, pr-report, codeql y ci-tools; deploy-gate; release.yml con release-please, Trivy, syft y attestations; dependency-review.yml; y dependabot.yml, que sigue vigilando ops/runner. A la derecha, lo nuevo. lab.yml cambia de runner: el job unit pide runs-on tablero-runners, sigue siendo solo workflow_dispatch, con concurrency sin cancelación, timeout de 15 minutos y contents read. En ops/arc, install.sh fija ARC_VERSION 0.15.1, instala con helm upgrade --install el controller arc en arc-systems y el scale set tablero-runners en arc-runners desde los charts OCI, y crea el secret tablero-arc-app con --from-file sin tocar el repo. values.yaml registra el scale set en el repositorio tablero, referencia el secret por nombre, escala de 0 a 2 runners, no declara containerMode y endurece el pod: uid 1001 sin root, sin escalada, sin capacidades, sin token de la API de Kubernetes, seccomp RuntimeDefault, límites de CPU y memoria y la misma imagen del runner por digest que ops/runner/Dockerfile. .github/actionlint.yaml declara tablero-lab y tablero-runners. En configuración: la política de la org limita los runners de repositorio a tablero, la aprobación de PR de forks exige aprobar a todos los contribuidores externos, y una GitHub App de la org sin webhook, instalada solo en tablero con Administration de lectura y escritura y Metadata de lectura, cuya clave vive en tu máquina. En gris, lo que llega después: el despliegue continuo a Kubernetes en la Semana 17, merge queue y rulesets en la 18 y rendimiento, coste y observabilidad en la 19.</title>
  <rect width="960" height="950" fill="#0d1117"/>
  <defs>
    <marker id="a16" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#79c0ff"/></marker>
  </defs>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="480" y="36" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">tablero · capa 16</text>

    <!-- regla común -->
    <rect x="30" y="58" width="900" height="44" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="46" y="85" fill="#3fb950" font-size="12" font-weight="600">en todos los workflows</text>
    <text x="210" y="85" fill="#f0f6fc" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">permissions: {} en la raíz · permisos por job · nada de ${{ }} en run:</text>

    <text x="30" y="134" fill="#f0f6fc" font-size="14" font-weight="600">Ya existían · ubuntu-24.04</text>
    <text x="930" y="134" fill="#2088ff" font-size="14" font-weight="600" text-anchor="end">Nuevos en la capa 16 · ARC en kind</text>

    <!-- existentes -->
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">
      <rect x="30" y="146" width="290" height="36" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="46" y="169" fill="#f0f6fc" font-size="12" font-weight="600">ci-api · ci · ci-web</text>
      <text x="304" y="169" fill="#8b949e" text-anchor="end">contents: read</text>

      <rect x="30" y="190" width="290" height="36" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="46" y="213" fill="#f0f6fc" font-size="12" font-weight="600">images</text>
      <text x="304" y="213" fill="#8b949e" text-anchor="end">por SHA · _image.yml</text>

      <rect x="30" y="234" width="290" height="36" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="46" y="257" fill="#f0f6fc" font-size="12" font-weight="600">nightly · smoke</text>
      <text x="304" y="257" fill="#8b949e" text-anchor="end">lint-workflows</text>

      <rect x="30" y="278" width="290" height="36" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="46" y="301" fill="#f0f6fc" font-size="12" font-weight="600">labeler · pr-report</text>
      <text x="304" y="301" fill="#8b949e" text-anchor="end">codeql · ci-tools</text>

      <rect x="30" y="322" width="290" height="36" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="46" y="345" fill="#f0f6fc" font-size="12" font-weight="600">deploy-gate</text>
      <text x="304" y="345" fill="#8b949e" text-anchor="end">staging → production</text>

      <rect x="30" y="366" width="290" height="58" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="46" y="389" fill="#f0f6fc" font-size="12" font-weight="600">release.yml</text>
      <text x="304" y="389" fill="#8b949e" text-anchor="end">release-please</text>
      <text x="46" y="410" fill="#3fb950">trivy · syft · attestations</text>

      <rect x="30" y="432" width="290" height="36" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="46" y="455" fill="#f0f6fc" font-size="12" font-weight="600">dependency-review.yml</text>
      <text x="304" y="455" fill="#8b949e" text-anchor="end">high</text>

      <rect x="30" y="476" width="290" height="110" rx="8" fill="#161b22" stroke="#30363d"/>
      <text x="46" y="500" fill="#f0f6fc" font-size="13" font-weight="600">dependabot.yml</text>
      <text x="46" y="522" fill="#8b949e">actions · uv · npm (pnpm)</text>
      <text x="46" y="540" fill="#f0f6fc">docker: /api · /web</text>
      <text x="46" y="558" fill="#f0f6fc">  · /ops/runner</text>
      <text x="46" y="576" fill="#8b949e">cooldown: 7 días</text>
    </g>

    <!-- lab.yml -->
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">
      <rect x="350" y="146" width="580" height="206" rx="8" fill="#161b22" stroke="#2088ff" stroke-width="2"/>
      <text x="366" y="170" fill="#2088ff" font-size="13" font-weight="600">lab.yml</text>
      <text x="914" y="170" fill="#79c0ff" text-anchor="end">workflow_dispatch · concurrency sin cancelar</text>

      <rect x="366" y="184" width="548" height="152" rx="6" fill="#0d1117" stroke="#3fb950"/>
      <text x="378" y="204" fill="#f0f6fc" font-size="12" font-weight="600">unit</text>
      <text x="902" y="204" fill="#3fb950" text-anchor="end">runs-on: tablero-runners</text>
      <text x="378" y="224" fill="#8b949e">timeout-minutes: 15 · contents: read · working-directory: api</text>
      <text x="378" y="250" fill="#f0f6fc">echo $RUNNER_NAME</text>
      <text x="378" y="268" fill="#f0f6fc">checkout · persist-credentials: false</text>
      <text x="378" y="286" fill="#f0f6fc">setup-uv → uv sync --locked</text>
      <text x="378" y="304" fill="#f0f6fc">uv run --no-sync pytest tests/unit</text>
      <text x="378" y="326" fill="#8b949e">el único job que pide un runner propio</text>
    </g>

    <!-- ops/arc -->
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">
      <rect x="350" y="368" width="580" height="280" rx="8" fill="#161b22" stroke="#2088ff" stroke-width="2"/>
      <text x="366" y="392" fill="#2088ff" font-size="13" font-weight="600">ops/arc/ · ARC en kind-gha</text>
      <text x="914" y="392" fill="#79c0ff" text-anchor="end">un pod por job, de 0 a 2</text>

      <rect x="366" y="406" width="270" height="114" rx="6" fill="#0d1117" stroke="#30363d"/>
      <text x="378" y="426" fill="#f0f6fc" font-size="12" font-weight="600">install.sh</text>
      <text x="378" y="446" fill="#3fb950">ARC_VERSION=0.15.1</text>
      <text x="378" y="464" fill="#f0f6fc">helm upgrade --install</text>
      <text x="378" y="480" fill="#8b949e">  arc · arc-systems</text>
      <text x="378" y="496" fill="#8b949e">  tablero-runners · arc-runners</text>
      <text x="378" y="512" fill="#d2a8ff">secret --from-file</text>

      <rect x="366" y="528" width="270" height="52" rx="6" fill="#0d1117" stroke="#30363d"/>
      <text x="378" y="548" fill="#f0f6fc" font-size="12" font-weight="600">ops/runner/Dockerfile</text>
      <text x="378" y="568" fill="#3fb950">actions-runner:2.338.2@…1300</text>

      <rect x="366" y="590" width="270" height="46" rx="6" fill="#0d1117" stroke="#30363d"/>
      <text x="378" y="609" fill="#f0f6fc" font-size="12" font-weight="600">.github/actionlint.yaml</text>
      <text x="378" y="626" fill="#f0f6fc">labels: [tablero-lab, tablero-runners]</text>

      <rect x="652" y="406" width="262" height="230" rx="6" fill="#0d1117" stroke="#30363d"/>
      <text x="664" y="426" fill="#f0f6fc" font-size="12" font-weight="600">values.yaml</text>
      <text x="664" y="446" fill="#f0f6fc">githubConfigUrl: …/tablero</text>
      <text x="664" y="462" fill="#d2a8ff">githubConfigSecret:</text>
      <text x="664" y="478" fill="#d2a8ff">  tablero-arc-app</text>
      <text x="664" y="494" fill="#f0f6fc">minRunners: 0 · maxRunners: 2</text>
      <text x="664" y="512" fill="#f85149">sin containerMode</text>
      <text x="664" y="530" fill="#3fb950">runAsNonRoot · uid 1001</text>
      <text x="664" y="546" fill="#3fb950">seccomp RuntimeDefault</text>
      <text x="664" y="562" fill="#3fb950">sin escalada · drop [ALL]</text>
      <text x="664" y="578" fill="#f85149">sin token de Kubernetes</text>
      <text x="664" y="594" fill="#3fb950">limits: cpu 2 · memory 4Gi</text>
      <text x="664" y="612" fill="#3fb950">imagen = la del Dockerfile</text>
      <text x="664" y="628" fill="#8b949e">  por digest</text>
    </g>
    <path d="M644 406 L644 340" stroke="#79c0ff" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#a16)"/>
    <path d="M636 554 L650 554" stroke="#3fb950" stroke-width="2" fill="none"/>

    <!-- configuración -->
    <text x="30" y="686" fill="#d2a8ff" font-size="14" font-weight="600">Configuración de &lt;tu-org&gt; y &lt;tu-org&gt;/tablero</text>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">
      <rect x="30" y="698" width="280" height="84" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
      <text x="46" y="722" fill="#d2a8ff" font-size="13" font-weight="600">org · runners de repo</text>
      <text x="46" y="744" fill="#f0f6fc">enabled_repositories:</text>
      <text x="46" y="762" fill="#f0f6fc">  selected · solo tablero</text>

      <rect x="340" y="698" width="280" height="84" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
      <text x="356" y="722" fill="#d2a8ff" font-size="13" font-weight="600">repo · PR de forks</text>
      <text x="356" y="744" fill="#f0f6fc">all_external_contributors</text>
      <text x="356" y="762" fill="#8b949e">revisa .github/ antes</text>

      <rect x="650" y="698" width="280" height="84" rx="8" fill="#161b22" stroke="#2088ff" stroke-width="2"/>
      <text x="666" y="722" fill="#2088ff" font-size="13" font-weight="600">GitHub App · nueva</text>
      <text x="666" y="744" fill="#f0f6fc">solo en tablero · sin webhook</text>
      <text x="666" y="762" fill="#8b949e">clave en ~/.config/tablero-arc</text>
    </g>

    <!-- después -->
    <g font-size="12" fill="#8b949e">
      <rect x="30" y="806" width="280" height="44" rx="8" fill="#0d1117" stroke="#30363d" stroke-dasharray="6 4"/>
      <text x="46" y="833"><tspan font-weight="600">Semana 17</tspan> · despliegue a Kubernetes</text>
      <rect x="340" y="806" width="280" height="44" rx="8" fill="#0d1117" stroke="#30363d" stroke-dasharray="6 4"/>
      <text x="356" y="833"><tspan font-weight="600">Semana 18</tspan> · merge queue y rulesets</text>
      <rect x="650" y="806" width="280" height="44" rx="8" fill="#0d1117" stroke="#30363d" stroke-dasharray="6 4"/>
      <text x="666" y="833"><tspan font-weight="600">Semana 19</tspan> · rendimiento y coste</text>
    </g>
    <text x="480" y="886" fill="#8b949e" font-size="11" text-anchor="middle">Azul: workflows y piezas nuevas o ampliadas. Verde: lo fijado por versión o digest y las capas del pod. Morado: configuración y credenciales.</text>
    <text x="480" y="904" fill="#8b949e" font-size="11" text-anchor="middle">Rojo: lo que el pod no tiene a propósito.</text>
    <text x="480" y="922" fill="#8b949e" font-size="11" text-anchor="middle">Gris discontinuo: lo que añaden las siguientes semanas.</text>
  </g>
</svg>
