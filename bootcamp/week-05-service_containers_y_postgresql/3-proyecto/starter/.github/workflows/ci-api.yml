# ci-api.yml — capa 05 de tablero.
# Sustituye a .github/workflows/ci-api.yml de <tu-org>/tablero. Trae lint y test tal como
# quedaron en la capa 03; si los tuyos difieren, conserva los tuyos y copia solo integration.
# Tal como está pasa actionlint, pero no cumple la capa: check-week.sh 05 sale en rojo.
name: ci-api

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Mínimo privilegio: lo verás a fondo en la Semana 12.
permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: api

jobs:
  lint:
    name: Lint y formato (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Dependencias exactas del lockfile
        run: uv sync --locked
      - name: ruff check
        run: uv run --no-sync ruff check --output-format=github .
      - name: ruff format
        run: uv run --no-sync ruff format --check .

  test:
    name: Tests unitarios
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Dependencias exactas del lockfile
        run: uv sync --locked
      - name: pytest con cobertura
        run: uv run --no-sync pytest tests/unit --cov=tablero --cov-report=term-missing --cov-fail-under=60

  integration:
    name: Tests de integración (PostgreSQL 17)
    # TODO 1: que este job solo empiece cuando test haya terminado bien.
    runs-on: ubuntu-24.04
    # TODO 2: service postgres con la imagen de PostgreSQL 17 de docs/stack-versions.md, usuario
    # tablero, contraseña cambiame, base tablero_test, el puerto 5432 publicado en el runner y un
    # healthcheck con pg_isready y reintentos.
    # TODO 3: DATABASE_URL a nivel de job. ¿localhost o postgres? Depende de dónde corre el job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Dependencias exactas del lockfile
        run: uv sync --locked
      # TODO 4: migraciones con python -m tablero.migrate y después pytest sobre tests/integration,
      # los dos con uv run --no-sync.
      - run: echo "integration pendiente" && exit 1
      # TODO 5: un step que, solo si algo ha fallado, vuelque los logs del contenedor de
      # PostgreSQL. Su id está en el contexto job.services; pásalo por env:.
