<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t04">
  <title id="t04">Mapa del pipeline de tablero en la capa 02: ci.yml se dispara con push a main, pull_request y workflow_dispatch, con permissions contents read y bash como shell por defecto. Los jobs runner-info, structure y version corren en paralelo; version publica el output version, que es la versión de api/pyproject.toml más el SHA corto. El job summary espera a los tres, corre salvo que el run se cancele y escribe el resumen del run con vars.PROJECT_NAME, la versión y el resultado de cada job. En gris, lo que llega después: ci-api en la Semana 03, ci-web en la 04, integración con PostgreSQL en la 05 e imágenes en GHCR en la 06</title>
  <rect width="960" height="560" fill="#0d1117"/>
  <defs>
    <marker id="b-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#79c0ff"/></marker>
  </defs>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="480" y="36" fill="#f0f6fc" font-size="20" font-weight="600">
      <tspan text-anchor="middle" x="480">tablero · capa 02</tspan>
    </text>

    <!-- eventos -->
    <g font-size="13">
      <rect x="30" y="90" width="170" height="34" rx="17" fill="#0d1117" stroke="#79c0ff"/>
      <text x="115" y="112" fill="#79c0ff" text-anchor="middle">push a main</text>
      <rect x="30" y="140" width="170" height="34" rx="17" fill="#0d1117" stroke="#79c0ff"/>
      <text x="115" y="162" fill="#79c0ff" text-anchor="middle">pull_request</text>
      <rect x="30" y="190" width="170" height="34" rx="17" fill="#0d1117" stroke="#79c0ff"/>
      <text x="115" y="212" fill="#79c0ff" text-anchor="middle">workflow_dispatch</text>
    </g>
    <path d="M200 107 L246 150" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#b-arrow)"/>
    <path d="M200 157 L244 157" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#b-arrow)"/>
    <path d="M200 207 L246 164" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#b-arrow)"/>

    <!-- ci.yml -->
    <rect x="250" y="60" width="680" height="300" rx="8" fill="#161b22" stroke="#2088ff" stroke-width="2"/>
    <text x="270" y="88" fill="#2088ff" font-size="15" font-weight="600">ci.yml</text>
    <g font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#d2a8ff">
      <text x="910" y="84" text-anchor="end">permissions: contents: read</text>
      <text x="910" y="102" text-anchor="end">defaults.run.shell: bash</text>
    </g>

    <rect x="270" y="120" width="170" height="70" rx="6" fill="#0d1117" stroke="#2088ff"/>
    <text x="355" y="146" fill="#f0f6fc" font-size="14" font-weight="600" text-anchor="middle">runner-info</text>
    <text x="355" y="168" fill="#8b949e" font-size="12" text-anchor="middle">SO, CPU, memoria</text>

    <rect x="270" y="200" width="170" height="70" rx="6" fill="#0d1117" stroke="#2088ff"/>
    <text x="355" y="226" fill="#f0f6fc" font-size="14" font-weight="600" text-anchor="middle">structure</text>
    <text x="355" y="248" fill="#8b949e" font-size="12" text-anchor="middle">lockfiles y compose</text>

    <rect x="270" y="280" width="170" height="70" rx="6" fill="#0d1117" stroke="#2088ff" stroke-width="2"/>
    <text x="355" y="304" fill="#f0f6fc" font-size="14" font-weight="600" text-anchor="middle">version</text>
    <text x="355" y="324" fill="#79c0ff" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">output version</text>
    <text x="355" y="340" fill="#8b949e" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">1.0.0+abc1234</text>

    <text x="355" y="114" fill="#8b949e" font-size="11" text-anchor="middle">en paralelo</text>

    <path d="M440 155 C 540 155, 540 220, 618 220" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#b-arrow)"/>
    <path d="M440 235 L618 235" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#b-arrow)"/>
    <path d="M440 315 C 540 315, 540 250, 618 250" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#b-arrow)"/>
    <text x="540" y="338" fill="#79c0ff" font-size="11" text-anchor="middle">needs.version</text>
    <text x="540" y="352" fill="#79c0ff" font-size="11" text-anchor="middle">.outputs.version</text>

    <rect x="620" y="170" width="290" height="130" rx="6" fill="#0d1117" stroke="#2088ff" stroke-width="2"/>
    <text x="765" y="196" fill="#f0f6fc" font-size="14" font-weight="600" text-anchor="middle">summary</text>
    <text x="765" y="216" fill="#e3b341" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">if: !cancelled()</text>
    <g font-size="12" fill="#f0f6fc">
      <text x="636" y="242">· resumen con vars.PROJECT_NAME</text>
      <text x="636" y="262">· versión y resultado de cada job</text>
      <text x="636" y="282">· falla si un job no terminó bien</text>
    </g>
    <text x="765" y="330" fill="#3fb950" font-size="12" text-anchor="middle">GITHUB_STEP_SUMMARY: página del run</text>

    <!-- lo que llega después -->
    <text x="30" y="400" fill="#8b949e" font-size="14" font-weight="600">Lo que llega después</text>
    <g font-size="13" fill="#8b949e">
      <rect x="30" y="416" width="210" height="100" rx="8" fill="#0d1117" stroke="#30363d" stroke-dasharray="6 4"/>
      <text x="50" y="444" font-weight="600">Semana 03</text><text x="50" y="468">ci-api.yml</text><text x="50" y="490">uv, ruff, pytest, caché</text>
      <rect x="260" y="416" width="210" height="100" rx="8" fill="#0d1117" stroke="#30363d" stroke-dasharray="6 4"/>
      <text x="280" y="444" font-weight="600">Semana 04</text><text x="280" y="468">ci-web.yml</text><text x="280" y="490">pnpm, matriz, artefactos</text>
      <rect x="490" y="416" width="210" height="100" rx="8" fill="#0d1117" stroke="#30363d" stroke-dasharray="6 4"/>
      <text x="510" y="444" font-weight="600">Semana 05</text><text x="510" y="468">integración</text><text x="510" y="490">PostgreSQL 17 como service</text>
      <rect x="720" y="416" width="210" height="100" rx="8" fill="#0d1117" stroke="#30363d" stroke-dasharray="6 4"/>
      <text x="740" y="444" font-weight="600">Semana 06</text><text x="740" y="468">images.yml</text><text x="740" y="490">imágenes en GHCR por digest</text>
    </g>
    <text x="480" y="544" fill="#8b949e" font-size="12" text-anchor="middle">En azul, lo que existe al terminar esta semana. En gris discontinuo, lo que añaden las siguientes.</text>
  </g>
</svg>
