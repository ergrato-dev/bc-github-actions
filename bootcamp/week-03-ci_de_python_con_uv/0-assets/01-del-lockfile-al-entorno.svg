<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t01">
  <title id="t01">Del lockfile al entorno: pyproject.toml declara rangos; uv lock los resuelve en uv.lock con versión exacta y hash de cada paquete; en CI, uv sync --locked comprueba que el lockfile casa con pyproject.toml; si casa crea .venv con el Python 3.15 que pide .python-version y uv run --no-sync ejecuta ruff y pytest sin volver a instalar; si no casa, falla con exit 1 sin instalar nada</title>
  <defs>
    <marker id="a01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="a01g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/>
    </marker>
    <marker id="a01r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f85149"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#0d1117"/>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="480" y="36" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">Del lockfile al entorno</text>
    <text x="40" y="66" fill="#8b949e" font-size="13">En tu máquina</text>
    <text x="40" y="276" fill="#8b949e" font-size="13">En el runner, cada job</text>

    <rect x="40" y="80" width="260" height="110" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5"/>
    <text x="170" y="108" fill="#f0f6fc" font-size="15" font-weight="600" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">pyproject.toml</text>
    <text x="170" y="134" fill="#8b949e" font-size="13" text-anchor="middle">rangos que el proyecto acepta</text>
    <text x="170" y="162" fill="#d2a8ff" font-size="13" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">fastapi&gt;=0.162.0</text>

    <rect x="350" y="80" width="260" height="110" rx="8" fill="#161b22" stroke="#2088ff" stroke-width="1.5"/>
    <text x="480" y="108" fill="#f0f6fc" font-size="15" font-weight="600" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">uv lock</text>
    <text x="480" y="134" fill="#8b949e" font-size="13" text-anchor="middle">resuelve los rangos una vez</text>
    <text x="480" y="160" fill="#8b949e" font-size="13" text-anchor="middle">y lo comiteas junto al cambio</text>

    <rect x="660" y="80" width="260" height="110" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5"/>
    <text x="790" y="108" fill="#f0f6fc" font-size="15" font-weight="600" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">uv.lock</text>
    <text x="790" y="134" fill="#8b949e" font-size="13" text-anchor="middle">31 paquetes: versión exacta</text>
    <text x="790" y="160" fill="#8b949e" font-size="13" text-anchor="middle">y sha256 de cada archivo</text>

    <line x1="300" y1="135" x2="346" y2="135" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a01)"/>
    <line x1="610" y1="135" x2="656" y2="135" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a01)"/>
    <path d="M790 190 L790 230 L240 230 L240 286" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a01)"/>
    <text x="480" y="222" fill="#8b949e" font-size="12" text-anchor="middle">git push: el lockfile viaja en el repo</text>

    <rect x="40" y="290" width="260" height="110" rx="8" fill="#161b22" stroke="#2088ff" stroke-width="2"/>
    <text x="170" y="318" fill="#f0f6fc" font-size="15" font-weight="600" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">uv sync --locked</text>
    <text x="170" y="344" fill="#8b949e" font-size="13" text-anchor="middle">¿uv.lock casa con</text>
    <text x="170" y="364" fill="#8b949e" font-size="13" text-anchor="middle">pyproject.toml?</text>

    <rect x="350" y="290" width="260" height="110" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="480" y="318" fill="#f0f6fc" font-size="15" font-weight="600" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">.venv</text>
    <text x="480" y="344" fill="#8b949e" font-size="13" text-anchor="middle">CPython 3.15 de .python-version</text>
    <text x="480" y="364" fill="#8b949e" font-size="13" text-anchor="middle">y lo que dice uv.lock, nada más</text>

    <rect x="660" y="290" width="260" height="110" rx="8" fill="#161b22" stroke="#2088ff" stroke-width="1.5"/>
    <text x="790" y="318" fill="#f0f6fc" font-size="15" font-weight="600" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">uv run --no-sync</text>
    <text x="790" y="344" fill="#8b949e" font-size="13" text-anchor="middle">ruff check · ruff format --check</text>
    <text x="790" y="364" fill="#8b949e" font-size="13" text-anchor="middle">pytest, sin volver a instalar</text>

    <line x1="300" y1="345" x2="346" y2="345" stroke="#3fb950" stroke-width="1.5" marker-end="url(#a01g)"/>
    <text x="323" y="336" fill="#3fb950" font-size="12" text-anchor="middle">casa</text>
    <line x1="610" y1="345" x2="656" y2="345" stroke="#8b949e" stroke-width="1.5" marker-end="url(#a01)"/>

    <line x1="170" y1="400" x2="170" y2="436" stroke="#f85149" stroke-width="1.5" marker-end="url(#a01r)"/>
    <text x="182" y="424" fill="#f85149" font-size="12">no casa</text>
    <rect x="40" y="440" width="560" height="76" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <text x="56" y="466" fill="#f85149" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">error: The lockfile at `uv.lock` needs to be updated</text>
    <text x="56" y="494" fill="#8b949e" font-size="13">exit 1 y no instala nada: el job falla antes del primer test</text>

    <rect x="660" y="440" width="260" height="76" rx="8" fill="#161b22" stroke="#e3b341" stroke-width="1.5"/>
    <text x="790" y="466" fill="#e3b341" font-size="13" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">--frozen no comprueba</text>
    <text x="790" y="494" fill="#8b949e" font-size="13" text-anchor="middle">verde sin la dependencia nueva</text>
  </g>
</svg>
