<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t03">
  <title id="t03">Mapa del pipeline de tablero en la capa 03. Los eventos push a main, pull_request y workflow_dispatch disparan dos workflows a la vez. ci.yml, de la capa 02, con runner-info, structure y version en paralelo y summary que los espera. El nuevo ci-api.yml, con permissions contents read y todos sus run en api/, tiene dos jobs en paralelo: lint, que ejecuta ruff check y ruff format --check, y test, que ejecuta pytest sobre tests/unit con al menos un 60 por ciento de cobertura. Los dos preparan el entorno con astral-sh/setup-uv fijado por SHA, uv 0.13.6, caché atada a api/uv.lock y uv sync --locked. En gris, lo que llega después: ci-web en la Semana 04, integración con PostgreSQL en la 05 e imágenes en GHCR en la 06</title>
  <rect width="960" height="600" fill="#0d1117"/>
  <defs>
    <marker id="a03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#79c0ff"/></marker>
  </defs>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="480" y="36" fill="#f0f6fc" font-size="20" font-weight="600" text-anchor="middle">tablero · capa 03</text>

    <!-- eventos -->
    <g font-size="13">
      <rect x="30" y="150" width="170" height="34" rx="17" fill="#0d1117" stroke="#79c0ff"/>
      <text x="115" y="172" fill="#79c0ff" text-anchor="middle">push a main</text>
      <rect x="30" y="200" width="170" height="34" rx="17" fill="#0d1117" stroke="#79c0ff"/>
      <text x="115" y="222" fill="#79c0ff" text-anchor="middle">pull_request</text>
      <rect x="30" y="250" width="170" height="34" rx="17" fill="#0d1117" stroke="#79c0ff"/>
      <text x="115" y="272" fill="#79c0ff" text-anchor="middle">workflow_dispatch</text>
    </g>
    <path d="M200 217 C 225 217, 225 120, 246 120" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#a03)"/>
    <path d="M200 217 C 225 217, 225 330, 246 330" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#a03)"/>
    <text x="222" y="304" fill="#8b949e" font-size="11" text-anchor="middle">los dos</text>
    <text x="222" y="318" fill="#8b949e" font-size="11" text-anchor="middle">a la vez</text>

    <!-- ci.yml (capa 02) -->
    <rect x="250" y="64" width="680" height="120" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="270" y="90" fill="#f0f6fc" font-size="15" font-weight="600">ci.yml</text>
    <text x="910" y="90" fill="#8b949e" font-size="12" text-anchor="end">capa 02, sin cambios</text>
    <g font-size="12" fill="#f0f6fc" text-anchor="middle">
      <rect x="270" y="100" width="150" height="24" rx="5" fill="#0d1117" stroke="#2088ff"/><text x="345" y="117">runner-info</text>
      <rect x="270" y="128" width="150" height="24" rx="5" fill="#0d1117" stroke="#2088ff"/><text x="345" y="145">structure</text>
      <rect x="270" y="156" width="150" height="24" rx="5" fill="#0d1117" stroke="#2088ff"/><text x="345" y="173">version</text>
    </g>
    <path d="M420 112 C 530 112, 530 130, 636 130" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#a03)"/>
    <path d="M420 140 L636 140" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#a03)"/>
    <path d="M420 168 C 530 168, 530 150, 636 150" stroke="#79c0ff" stroke-width="2" fill="none" marker-end="url(#a03)"/>
    <text x="528" y="104" fill="#79c0ff" font-size="11" text-anchor="middle">needs</text>
    <rect x="640" y="112" width="150" height="56" rx="6" fill="#0d1117" stroke="#2088ff"/>
    <text x="715" y="136" fill="#f0f6fc" font-size="13" text-anchor="middle">summary</text>
    <text x="715" y="156" fill="#e3b341" font-size="11" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">if: !cancelled()</text>

    <!-- ci-api.yml -->
    <rect x="250" y="200" width="680" height="250" rx="8" fill="#161b22" stroke="#2088ff" stroke-width="2"/>
    <text x="270" y="228" fill="#2088ff" font-size="15" font-weight="600">ci-api.yml</text>
    <g font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#d2a8ff" text-anchor="end">
      <text x="910" y="224">permissions: contents: read</text>
      <text x="910" y="242">defaults.run.working-directory: api</text>
    </g>

    <rect x="270" y="258" width="285" height="120" rx="6" fill="#0d1117" stroke="#2088ff" stroke-width="2"/>
    <text x="412" y="284" fill="#f0f6fc" font-size="14" font-weight="600" text-anchor="middle">lint</text>
    <g font-size="12" fill="#f0f6fc" font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="290" y="312">ruff check</text>
      <text x="290" y="334">ruff format --check</text>
    </g>
    <text x="290" y="362" fill="#8b949e" font-size="12">anotaciones en la línea del PR</text>

    <rect x="625" y="258" width="285" height="120" rx="6" fill="#0d1117" stroke="#2088ff" stroke-width="2"/>
    <text x="767" y="284" fill="#f0f6fc" font-size="14" font-weight="600" text-anchor="middle">test</text>
    <g font-size="12" fill="#f0f6fc" font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="645" y="312">pytest tests/unit</text>
      <text x="645" y="334">--cov-fail-under=60</text>
    </g>
    <text x="645" y="362" fill="#8b949e" font-size="12">sin base de datos: dobles en memoria</text>

    <text x="590" y="322" fill="#8b949e" font-size="11" text-anchor="middle">en</text>
    <text x="590" y="336" fill="#8b949e" font-size="11" text-anchor="middle">paralelo</text>

    <rect x="270" y="392" width="640" height="44" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="590" y="410" fill="#f0f6fc" font-size="12" text-anchor="middle">Preparación en cada job: checkout por SHA · setup-uv por SHA con uv 0.13.6</text>
    <text x="590" y="428" fill="#3fb950" font-size="12" text-anchor="middle">caché atada a api/uv.lock · uv sync --locked · uv run --no-sync</text>

    <!-- lo que llega después -->
    <text x="30" y="482" fill="#8b949e" font-size="14" font-weight="600">Lo que llega después</text>
    <g font-size="13" fill="#8b949e">
      <rect x="30" y="496" width="280" height="70" rx="8" fill="#0d1117" stroke="#30363d" stroke-dasharray="6 4"/>
      <text x="50" y="522" font-weight="600">Semana 04</text><text x="50" y="546">ci-web.yml: pnpm, matriz, artefactos</text>
      <rect x="340" y="496" width="280" height="70" rx="8" fill="#0d1117" stroke="#30363d" stroke-dasharray="6 4"/>
      <text x="360" y="522" font-weight="600">Semana 05</text><text x="360" y="546">integración: PostgreSQL 17 como service</text>
      <rect x="650" y="496" width="280" height="70" rx="8" fill="#0d1117" stroke="#30363d" stroke-dasharray="6 4"/>
      <text x="670" y="522" font-weight="600">Semana 06</text><text x="670" y="546">images.yml: imágenes en GHCR</text>
    </g>
    <text x="480" y="588" fill="#8b949e" font-size="12" text-anchor="middle">En azul, lo que existe al terminar esta semana. En gris discontinuo, lo que añaden las siguientes.</text>
  </g>
</svg>
