[project]
name = "tablero"
version = "1.0.0"
description = "API de tablero, la app de referencia del bootcamp GitHub Actions"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "httpx2>=2.16.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: necesita PostgreSQL en DATABASE_URL"]
