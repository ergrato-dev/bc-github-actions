# Imagen de nodo fijada por digest, como exige kind para garantizar que la
# imagen corresponde a su versión (versiones en docs/stack-versions.md).
# Se crea con ./scripts/lab-up.sh, no a mano.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gha
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
