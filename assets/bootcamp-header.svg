<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200" role="img" aria-labelledby="titulo-header">
  <title id="titulo-header">Bootcamp GitHub Actions, de cero a avanzado: un pipeline de cuatro etapas (lint, test, build y deploy) unidas por flechas, con la etapa final verde</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="800" height="200" fill="#0d1117"/>
  <rect width="800" height="200" fill="url(#grid)" opacity="0.5"/>

  <!-- Icono: grafo de un workflow (evento -> dos jobs -> job final) -->
  <g transform="translate(40, 52)" stroke-width="3" fill="none">
    <circle cx="16" cy="48" r="14" stroke="#79c0ff"/>
    <rect x="58" y="6" width="34" height="28" rx="6" stroke="#2088ff"/>
    <rect x="58" y="62" width="34" height="28" rx="6" stroke="#2088ff"/>
    <rect x="118" y="34" width="34" height="28" rx="6" stroke="#3fb950"/>
    <path d="M30,42 L58,22 M30,54 L58,76 M92,20 L118,42 M92,76 L118,54" stroke="#8b949e" stroke-width="2"/>
  </g>

  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="220" y="88" font-size="40" font-weight="700" fill="#f0f6fc">GitHub Actions</text>
    <text x="220" y="128" font-size="24" fill="#8b949e">Zero to Advanced Bootcamp</text>
    <text x="220" y="160" font-size="14" fill="#2088ff">20 semanas · 200 horas · uv · pnpm · PostgreSQL · Docker</text>
  </g>

  <!-- Pipeline decorativo -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
    <rect x="600" y="40" width="72" height="26" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="636" y="57" fill="#f0f6fc">lint</text>
    <rect x="600" y="80" width="72" height="26" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="636" y="97" fill="#f0f6fc">test</text>
    <rect x="700" y="60" width="72" height="26" rx="5" fill="#161b22" stroke="#2088ff"/>
    <text x="736" y="77" fill="#f0f6fc">build</text>
    <rect x="700" y="124" width="72" height="26" rx="5" fill="#161b22" stroke="#3fb950"/>
    <text x="736" y="141" fill="#3fb950">deploy</text>
    <path d="M672,53 L698,68 M672,93 L698,79 M736,86 L736,120" stroke="#8b949e" stroke-width="1.5" fill="none" marker-end="url(#flecha)"/>
  </g>
</svg>
