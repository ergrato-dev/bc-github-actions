# Mantiene al dia los SHA de las actions del CI propio. Dependabot entiende
# el formato "uses: owner/repo@<sha> # vX.Y.Z" y actualiza SHA y comentario.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
